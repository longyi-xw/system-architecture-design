<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0ea5e9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="470" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">云计算与大数据技术概述（11.6）</text>
  <text x="410" y="45" text-anchor="middle" font-size="10.5" fill="#6b7280">本节只是概述 ｜ 云计算完整展开见第 14 章云原生，大数据完整展开见第 19 章</text>

  <!-- 左：服务方式三层 -->
  <rect x="20" y="58" width="380" height="212" rx="8" fill="#f0f9ff" stroke="#7dd3fc"/>
  <rect x="20" y="58" width="380" height="30" rx="8" fill="#075985"/>
  <text x="210" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">🔴 服务方式三层：越往上用户管得越少</text>
  <g>
    <rect x="38" y="98" width="344" height="48" rx="4" fill="#ffffff" stroke="#0ea5e9"/>
    <text x="50" y="116" font-size="11" font-weight="bold" fill="#075985">SaaS 软件即服务 — 精装拎包入住</text>
    <text x="50" y="134" font-size="9.5" fill="#374151">业务后台全放云端，经瘦客户端（浏览器）直供 <tspan font-weight="bold">最终用户</tspan></text>
  </g>
  <g>
    <rect x="38" y="152" width="344" height="48" rx="4" fill="#ffffff" stroke="#0ea5e9"/>
    <text x="50" y="170" font-size="11" font-weight="bold" fill="#075985">PaaS 平台即服务 — 毛坯房 + 水电</text>
    <text x="50" y="188" font-size="9.5" fill="#374151">构建在 IaaS 之上，额外提供业务软件<tspan font-weight="bold">运行环境</tspan>，面向<tspan font-weight="bold">开发者</tspan></text>
  </g>
  <g>
    <rect x="38" y="206" width="344" height="48" rx="4" fill="#ffffff" stroke="#0ea5e9"/>
    <text x="50" y="224" font-size="11" font-weight="bold" fill="#075985">IaaS 基础设施即服务 — 地基</text>
    <text x="50" y="242" font-size="9.5" fill="#374151">虚拟化打包服务器 + 存储 + 网络，以 API 提供（<tspan font-weight="bold">租云服务器＝IaaS</tspan>）</text>
  </g>
  <g stroke="#0ea5e9" stroke-width="1.5" fill="none" marker-end="url(#a3)">
    <line x1="392" y1="230" x2="392" y2="126"/>
  </g>

  <!-- 右：部署模式四种 -->
  <rect x="420" y="58" width="380" height="212" rx="8" fill="#fdf4ff" stroke="#f0abfc"/>
  <rect x="420" y="58" width="380" height="30" rx="8" fill="#701a75"/>
  <text x="610" y="78" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">🔴 部署模式四种：开放性递减 · 可控性递增</text>
  <g font-size="9.5">
    <g fill="#ffffff" stroke="#d946ef">
      <rect x="438" y="98" width="344" height="38" rx="4"/>
      <rect x="438" y="142" width="344" height="38" rx="4"/>
      <rect x="438" y="186" width="344" height="38" rx="4"/>
      <rect x="438" y="230" width="344" height="34" rx="4"/>
    </g>
    <text x="450" y="114" font-size="11" font-weight="bold" fill="#701a75">公有云 — 谁都能用</text>
    <text x="450" y="130" fill="#374151">服务供应商面向一般使用者，免费或按需付费</text>
    <text x="450" y="158" font-size="11" font-weight="bold" fill="#701a75">社区云 — 一圈人共用</text>
    <text x="450" y="174" fill="#374151">若干需求/目标相似的组织共享，兼顾经济性与安全性</text>
    <text x="450" y="202" font-size="11" font-weight="bold" fill="#701a75">私有云 — 只有我用</text>
    <text x="450" y="218" fill="#374151">自有或租用设施自建，始终在私有网络上（<tspan font-weight="bold">金融核心系统首选</tspan>）</text>
    <text x="450" y="246" font-size="11" font-weight="bold" fill="#701a75">混合云 — 拼起来用</text>
    <text x="450" y="260" fill="#374151">由两种或两种以上部署模式组成</text>
  </g>

  <!-- 底左：大数据分析五步骤 -->
  <rect x="20" y="284" width="500" height="166" rx="8" fill="#f7fee7" stroke="#bef264"/>
  <rect x="20" y="284" width="500" height="30" rx="8" fill="#365314"/>
  <text x="270" y="304" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">🔴 大数据分析五步骤：取 → 洗 → 合 → 算 → 解</text>
  <g font-size="9.5">
    <g fill="#ffffff" stroke="#84cc16">
      <rect x="38" y="324" width="464" height="22" rx="3"/>
      <rect x="38" y="350" width="464" height="22" rx="3"/>
      <rect x="38" y="376" width="464" height="22" rx="3"/>
      <rect x="38" y="402" width="464" height="22" rx="3"/>
    </g>
    <rect x="38" y="428" width="464" height="22" rx="3" fill="#fef2f2" stroke="#ef4444"/>
    <text x="50" y="339" fill="#365314"><tspan font-weight="bold">① 数据获取和记录</tspan> — 从各类数据源采集原始数据</text>
    <text x="50" y="365" fill="#365314"><tspan font-weight="bold">② 信息抽取和清洗</tspan> — 处理缺失值、重复值、异常值、噪声</text>
    <text x="50" y="391" fill="#365314"><tspan font-weight="bold">③ 数据集成、聚集和表示</tspan> — 异构数据融合到统一平台</text>
    <text x="50" y="417" fill="#365314"><tspan font-weight="bold">④ 查询处理、数据建模和分析</tspan> — 建模挖掘有用信息</text>
    <text x="50" y="443" fill="#991b1b"><tspan font-weight="bold">⑤ 解释</tspan> — 易漏！最后一步是「解释」，不是可视化或决策</text>
  </g>

  <!-- 底右：大数据 5V + 应用 -->
  <rect x="536" y="284" width="264" height="166" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <rect x="536" y="284" width="264" height="30" rx="8" fill="#78350f"/>
  <text x="668" y="304" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">🟡 大数据 5V（第 19 章详解）</text>
  <g font-size="9.5" fill="#374151">
    <text x="552" y="330"><tspan font-weight="bold" fill="#92400e">大</tspan> Volume — 规模巨大（TB/PB/EB）</text>
    <text x="552" y="348"><tspan font-weight="bold" fill="#92400e">快</tspan> Velocity — 产生与处理速度快</text>
    <text x="552" y="366"><tspan font-weight="bold" fill="#92400e">杂</tspan> Variety — 结构化/半/非结构化</text>
    <text x="552" y="384"><tspan font-weight="bold" fill="#92400e">值</tspan> Value — 总量大但价值密度低</text>
    <text x="552" y="402"><tspan font-weight="bold" fill="#92400e">真</tspan> Veracity — 准确可信（4V 口径无此项）</text>
  </g>
  <line x1="552" y1="412" x2="784" y2="412" stroke="#fcd34d"/>
  <text x="552" y="428" font-size="10" font-weight="bold" fill="#15803d">🟢 应用领域</text>
  <text x="552" y="443" font-size="9.5" fill="#374151">制造业 · 服务业 · 交通行业 · 医疗行业</text>
</svg>
