<svg xmlns="http://www.w3.org/2000/svg" width="820" height="590" viewBox="0 0 820 590" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="j1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="590" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="410" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">云原生架构内涵全景（14.2）</text>

  <!-- 定义 -->
  <rect x="20" y="36" width="780" height="60" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="34" y="55" font-size="11" font-weight="bold" fill="#991b1b">🔴 定义</text>
  <text x="34" y="74" font-size="10" fill="#374151">基于云原生技术的<tspan font-weight="bold" fill="#991b1b">一组架构原则和设计模式的集合</tspan>，旨在将云应用中的<tspan font-weight="bold" fill="#991b1b">非业务代码部分最大化剥离</tspan>，</text>
  <text x="34" y="90" font-size="10" fill="#374151">从而让<tspan font-weight="bold" fill="#991b1b">云设施接管</tspan>原有的大量<tspan font-weight="bold">非功能特性</tspan>（弹性·韧性·安全·可观测性·灰度），使业务具备<tspan font-weight="bold" fill="#991b1b">轻量、敏捷、高度自动化</tspan></text>

  <!-- 云代码三部分 + 三大变化 -->
  <rect x="20" y="104" width="380" height="72" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="34" y="122" font-size="10.5" font-weight="bold" fill="#134e4a">🔴 云代码三部分</text>
  <g font-size="9.5">
    <rect x="34" y="130" width="110" height="36" rx="4" fill="#ffffff" stroke="#14b8a6"/>
    <text x="89" y="146" text-anchor="middle" font-weight="bold" fill="#134e4a">业务代码</text>
    <text x="89" y="160" text-anchor="middle" fill="#15803d">核心 · 留下</text>
    <rect x="150" y="130" width="110" height="36" rx="4" fill="#ffffff" stroke="#14b8a6"/>
    <text x="205" y="146" text-anchor="middle" font-weight="bold" fill="#134e4a">三方软件</text>
    <text x="205" y="160" text-anchor="middle" fill="#6b7280">依赖的各类库</text>
    <rect x="266" y="130" width="120" height="36" rx="4" fill="#fef2f2" stroke="#ef4444"/>
    <text x="326" y="146" text-anchor="middle" font-weight="bold" fill="#991b1b">非功能特性代码</text>
    <text x="326" y="160" text-anchor="middle" fill="#991b1b">剥离 → 交给云</text>
  </g>

  <rect x="420" y="104" width="380" height="72" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="434" y="122" font-size="10.5" font-weight="bold" fill="#1e3a5f">🔴 三大变化：代码变简单 · 杂活交给云 · 交付全自动</text>
  <g font-size="9" fill="#374151">
    <text x="434" y="139">① <tspan font-weight="bold">代码结构发生巨大变化</tspan> — 文件/网络/线程升级为服务、按需调用</text>
    <text x="434" y="154">② <tspan font-weight="bold">非功能性特性大量委托</tspan> — 剥离到 IaaS/PaaS，由云设施接管</text>
    <text x="434" y="169">③ <tspan font-weight="bold">高度自动化的软件交付</tspan> — 手工部署 → 自动化部署与部署策略</text>
  </g>

  <!-- 七大原则 -->
  <rect x="20" y="184" width="380" height="256" rx="8" fill="#faf5ff" stroke="#d8b4fe"/>
  <rect x="20" y="184" width="380" height="26" rx="8" fill="#4c1d95"/>
  <text x="210" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">🔴 七大原则：拆·伸缩·看得见·扛得住·全自动·谁都不信·一直变</text>
  <g font-size="9">
    <g fill="#ffffff" stroke="#a855f7">
      <rect x="34" y="218" width="352" height="28" rx="4"/>
      <rect x="34" y="249" width="352" height="28" rx="4"/>
      <rect x="34" y="280" width="352" height="28" rx="4"/>
      <rect x="34" y="311" width="352" height="28" rx="4"/>
      <rect x="34" y="342" width="352" height="28" rx="4"/>
      <rect x="34" y="373" width="352" height="28" rx="4"/>
      <rect x="34" y="404" width="352" height="28" rx="4"/>
    </g>
    <text x="46" y="236" fill="#374151"><tspan font-weight="bold" fill="#4c1d95">① 服务化「拆」</tspan> — 分离不同生命周期模块分别迭代</text>
    <text x="46" y="267" fill="#374151"><tspan font-weight="bold" fill="#4c1d95">② 弹性「伸缩」</tspan> — 部署规模随业务量自动伸缩，免容量规划</text>
    <text x="46" y="298" fill="#374151"><tspan font-weight="bold" fill="#4c1d95">③ 可观测「看得见」</tspan> — 日志/链路跟踪/度量，耗时返回值可见</text>
    <text x="46" y="329" fill="#374151"><tspan font-weight="bold" fill="#4c1d95">④ 韧性「扛得住」</tspan> — 组件异常时的抵御能力，提升 MTBF</text>
    <text x="46" y="360" fill="#374151"><tspan font-weight="bold" fill="#4c1d95">⑤ 所有过程自动化</tspan> — IaC / GitOps / OAM / K8s Operator</text>
    <text x="46" y="391" fill="#374151"><tspan font-weight="bold" fill="#4c1d95">⑥ 零信任「谁都不信」</tspan> — IP/主机/地理位置均非可信凭证</text>
    <text x="46" y="422" fill="#374151"><tspan font-weight="bold" fill="#4c1d95">⑦ 架构持续演进「一直变」</tspan></text>
  </g>

  <!-- 七种架构模式 -->
  <rect x="420" y="184" width="380" height="256" rx="8" fill="#f0f9ff" stroke="#7dd3fc"/>
  <rect x="420" y="184" width="380" height="26" rx="8" fill="#075985"/>
  <text x="610" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">🔴 七种主要架构模式</text>
  <g font-size="9">
    <g fill="#ffffff" stroke="#0ea5e9">
      <rect x="434" y="218" width="352" height="28" rx="4"/>
      <rect x="434" y="249" width="352" height="28" rx="4"/>
      <rect x="434" y="280" width="352" height="28" rx="4"/>
      <rect x="434" y="311" width="352" height="28" rx="4"/>
      <rect x="434" y="342" width="352" height="28" rx="4"/>
      <rect x="434" y="373" width="352" height="28" rx="4"/>
      <rect x="434" y="404" width="352" height="28" rx="4"/>
    </g>
    <text x="446" y="236" fill="#374151"><tspan font-weight="bold" fill="#075985">① 服务化架构模式</tspan> — 标准模式：模块为粒度、接口契约、标准协议</text>
    <text x="446" y="267" fill="#374151"><tspan font-weight="bold" fill="#075985">② Mesh 化架构模式</tspan> — 中间件从业务进程分离，只留 client</text>
    <text x="446" y="298" fill="#374151"><tspan font-weight="bold" fill="#075985">③ Serverless 模式</tspan> — 收走部署动作；事件驱动/短计算/无复杂互调</text>
    <text x="446" y="329" fill="#374151"><tspan font-weight="bold" fill="#075985">④ 存储计算分离模式</tspan> — 无状态无 C 维度，换得更好的 A 与 P</text>
    <text x="446" y="360" fill="#374151"><tspan font-weight="bold" fill="#075985">⑤ 分布式事务模式</tspan> — XA / BASE / TCC / SAGA / AT 五方案</text>
    <text x="446" y="391" fill="#374151"><tspan font-weight="bold" fill="#075985">⑥ 可观测架构</tspan> — <tspan font-weight="bold" fill="#991b1b">Logging · Tracing · Metrics</tspan></text>
    <text x="446" y="422" fill="#374151"><tspan font-weight="bold" fill="#075985">⑦ 事件驱动架构 EDA</tspan> — 本质是应用/组件间的集成架构模式</text>
  </g>

  <!-- 反模式 -->
  <rect x="20" y="448" width="780" height="126" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <rect x="20" y="448" width="780" height="26" rx="8" fill="#7c2d12"/>
  <text x="410" y="466" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">🔴 三大反模式：不拆不行 · 硬拆更糟 · 拆了不自动化＝自找麻烦</text>
  <g font-size="9">
    <rect x="34" y="482" width="248" height="82" rx="5" fill="#ffffff" stroke="#f97316"/>
    <text x="46" y="500" font-size="10" font-weight="bold" fill="#9a3412">① 庞大单体应用</text>
    <text x="46" y="516" fill="#374151">缺乏依赖隔离 · 代码耦合 ·</text>
    <text x="46" y="530" fill="#374151">模块间接口缺乏治理</text>
    <text x="46" y="546" fill="#991b1b">→ 变更影响扩散、只能整体扩容</text>
    <text x="46" y="559" fill="#15803d">解：服务化拆分、梳理聚合根</text>

    <rect x="298" y="482" width="248" height="82" rx="5" fill="#ffffff" stroke="#f97316"/>
    <text x="310" y="500" font-size="10" font-weight="bold" fill="#9a3412">② 单体「硬拆」为微服务</text>
    <text x="310" y="516" fill="#374151">小规模软件强行微服务化 ·</text>
    <text x="310" y="530" fill="#374151">服务间数据紧密耦合（共享库）</text>
    <text x="310" y="546" fill="#991b1b">→ 本地调用变分布式，性能降千倍</text>
    <text x="310" y="559" fill="#991b1b">→ 架构升级拿不到技术红利</text>

    <rect x="562" y="482" width="224" height="82" rx="5" fill="#ffffff" stroke="#f97316"/>
    <text x="574" y="500" font-size="10" font-weight="bold" fill="#9a3412">③ 缺乏自动化能力的微服务</text>
    <text x="574" y="516" fill="#374151">拆完后开发/测试/运维</text>
    <text x="574" y="530" fill="#374151">仍以进程为单位</text>
    <text x="574" y="546" fill="#991b1b">→ 人均模块数上升、成本增加</text>
    <text x="574" y="559" fill="#15803d">解：全自动化 CI/CD 流水线</text>
  </g>
</svg>
