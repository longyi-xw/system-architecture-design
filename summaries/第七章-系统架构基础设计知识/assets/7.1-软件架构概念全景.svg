<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="820" height="260" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">软件架构生命周期 · 重要性八条</text>

  <!-- ① 生命周期 -->
  <text x="20" y="48" font-size="13" font-weight="bold" fill="#1e3a5f">① 软件架构生命周期六阶段</text>
  <g stroke="#93c5fd" fill="#eff6ff">
    <rect x="20"  y="56" width="126" height="34" rx="6"/>
    <rect x="152" y="56" width="126" height="34" rx="6"/>
    <rect x="284" y="56" width="126" height="34" rx="6"/>
    <rect x="416" y="56" width="126" height="34" rx="6"/>
    <rect x="548" y="56" width="126" height="34" rx="6"/>
    <rect x="680" y="56" width="120" height="34" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e3a5f">
    <text x="83"  y="77">需求分析</text>
    <text x="215" y="77">设计</text>
    <text x="347" y="77">实现</text>
    <text x="479" y="77">构件组装</text>
    <text x="611" y="77">部署</text>
    <text x="740" y="77">后开发</text>
  </g>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrowT)">
    <path d="M 146 73 L 151 73"/>
    <path d="M 278 73 L 283 73"/>
    <path d="M 410 73 L 415 73"/>
    <path d="M 542 73 L 547 73"/>
    <path d="M 674 73 L 679 73"/>
  </g>

  <line x1="20" y1="106" x2="800" y2="106" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ② 重要性八条 -->
  <text x="20" y="128" font-size="13" font-weight="bold" fill="#7f1d1d">② 软件架构的重要性（🔴 八条，归并四组）</text>
  <g stroke="#fca5a5" fill="#fee2e2">
    <rect x="20"  y="136" width="190" height="46" rx="6"/>
    <rect x="218" y="136" width="190" height="46" rx="6"/>
    <rect x="416" y="136" width="190" height="46" rx="6"/>
    <rect x="614" y="136" width="186" height="46" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#7f1d1d">
    <text x="115" y="154" font-weight="bold">质量 + 目标</text>
    <text x="115" y="170" font-size="9">满足品质·达成一致目标</text>
    <text x="313" y="154" font-weight="bold">计划 + 指导</text>
    <text x="313" y="170" font-size="9">支持计划·指导开发</text>
    <text x="511" y="154" font-weight="bold">复杂性 + 复用</text>
    <text x="511" y="170" font-size="9">管理复杂性·奠定复用基础</text>
    <text x="707" y="154" font-weight="bold">成本 + 冲突</text>
    <text x="707" y="170" font-size="9">降低维护费用·支持冲突分析</text>
  </g>

  <text x="20" y="210" font-size="11" fill="#374151">设计金字塔两层次：数据设计（数据构件/类的定义）+ 体系结构设计（构件结构/属性/交互）</text>

  <defs>
    <marker id="arrowT" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#3b82f6"/>
    </marker>
  </defs>
</svg>
