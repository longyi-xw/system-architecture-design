<svg xmlns="http://www.w3.org/2000/svg" width="820" height="280" viewBox="0 0 820 280" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="820" height="280" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">ABSD：三基础 · 六子过程</text>

  <!-- ① ABSD三基础 -->
  <text x="20" y="48" font-size="13" font-weight="bold" fill="#7f1d1d">① ABSD 三个基础（🔴）</text>
  <g stroke="#fca5a5" fill="#fee2e2">
    <rect x="20"  y="56" width="253" height="46" rx="6"/>
    <rect x="284" y="56" width="253" height="46" rx="6"/>
    <rect x="548" y="56" width="252" height="46" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#7f1d1d">
    <text x="146" y="76" font-size="12" font-weight="bold">功能分解</text>
    <text x="146" y="92" font-size="9.5">基于模块的内聚和耦合技术</text>
    <text x="410" y="76" font-size="12" font-weight="bold">选择体系结构风格</text>
    <text x="410" y="92" font-size="9.5">实现质量和商业需求</text>
    <text x="674" y="76" font-size="12" font-weight="bold">软件模板</text>
    <text x="674" y="92" font-size="9.5">利用已有系统结构</text>
  </g>

  <line x1="20" y1="118" x2="800" y2="118" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ② 六子过程 -->
  <text x="20" y="140" font-size="13" font-weight="bold" fill="#1e3a5f">② 基于体系结构的开发模型：六子过程（🔴）</text>
  <g stroke="#93c5fd" fill="#eff6ff">
    <rect x="20"  y="148" width="126" height="40" rx="6"/>
    <rect x="152" y="148" width="126" height="40" rx="6"/>
    <rect x="284" y="148" width="126" height="40" rx="6"/>
    <rect x="416" y="148" width="126" height="40" rx="6"/>
    <rect x="548" y="148" width="126" height="40" rx="6"/>
    <rect x="680" y="148" width="120" height="40" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e3a5f">
    <text x="83"  y="164">体系结构</text>
    <text x="83"  y="178" font-size="9" font-weight="normal">需求</text>
    <text x="215" y="172">设计</text>
    <text x="347" y="172">文档化</text>
    <text x="479" y="164">复审</text>
    <text x="479" y="178" font-size="9" font-weight="normal">（质量把关）</text>
    <text x="611" y="172">实现</text>
    <text x="740" y="172">演化</text>
  </g>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrowU)">
    <path d="M 146 168 L 151 168"/>
    <path d="M 278 168 L 283 168"/>
    <path d="M 410 168 L 415 168"/>
    <path d="M 542 168 L 547 168"/>
    <path d="M 674 168 L 679 168"/>
  </g>

  <text x="20" y="220" font-size="11" fill="#374151">体系结构需求关注三类目标：系统质量目标 · 系统商业目标 · 开发人员商业目标</text>
  <text x="20" y="240" font-size="11" fill="#374151">体系结构设计五步：提出结构模型 → 映射构件 → 分析交互 → 产生体系结构 → 设计评审</text>
  <text x="20" y="260" font-size="11" fill="#374151">文档化两个输出：体系结构规格说明 + 质量设计说明书</text>

  <defs>
    <marker id="arrowU" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#3b82f6"/>
    </marker>
  </defs>
</svg>
