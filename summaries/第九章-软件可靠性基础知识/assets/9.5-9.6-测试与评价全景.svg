<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="820" height="430" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">软件可靠性测试（9.5）与评价（9.6）</text>

  <!-- 9.5 五活动 -->
  <text x="20" y="54" font-size="12.5" font-weight="bold" fill="#1e3a5f">🔴 9.5 可靠性测试五项活动</text>
  <g font-size="10" text-anchor="middle">
    <g stroke="#93c5fd" fill="#eff6ff">
      <rect x="20" y="64" width="146" height="56" rx="6"/>
      <rect x="176" y="64" width="146" height="56" rx="6"/>
      <rect x="332" y="64" width="146" height="56" rx="6"/>
      <rect x="488" y="64" width="146" height="56" rx="6"/>
      <rect x="644" y="64" width="156" height="56" rx="6"/>
    </g>
    <g fill="#1e3a5f">
      <text x="93" y="86" font-weight="bold">① 确定可靠性目标</text>
      <text x="93" y="104" font-size="8.5">明确定量指标</text>
      <text x="249" y="86" font-weight="bold">② 开发运行剖面</text>
      <text x="249" y="104" font-size="8.5">为使用行为建模 ★</text>
      <text x="405" y="86" font-weight="bold">③ 设计测试用例</text>
      <text x="405" y="100" font-size="8.5">标识/对象/环境/输入</text>
      <text x="405" y="112" font-size="8.5">/步骤/预期输出</text>
      <text x="561" y="86" font-weight="bold">④ 测试实施</text>
      <text x="722" y="86" font-weight="bold">⑤ 测试结果分析</text>
    </g>
  </g>
  <g stroke="#1e3a5f" stroke-width="1.4" fill="none" marker-end="url(#a95)">
    <line x1="166" y1="92" x2="174" y2="92"/>
    <line x1="322" y1="92" x2="330" y2="92"/>
    <line x1="478" y1="92" x2="486" y2="92"/>
    <line x1="634" y1="92" x2="642" y2="92"/>
  </g>
  <defs>
    <marker id="a95" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1e3a5f"/></marker>
  </defs>
  <text x="20" y="140" font-size="10" fill="#6b7280">★ 「运行剖面开发」是可靠性测试区别于普通测试的关键动作 —— 呼应 9.2.3「运行剖面是影响可靠性的首要因素」与 9.2.2「代表性假设」</text>

  <line x1="20" y1="156" x2="800" y2="156" stroke="#e5e7eb"/>

  <!-- 普通测试 vs 可靠性测试 -->
  <text x="20" y="180" font-size="12" font-weight="bold" fill="#78350f">辨析：普通软件测试 vs 软件可靠性测试</text>
  <g stroke="#fbbf24" fill="#fffbeb">
    <rect x="20" y="190" width="380" height="52" rx="6"/>
    <rect x="420" y="190" width="380" height="52" rx="6"/>
  </g>
  <g font-size="10.5" fill="#78350f">
    <text x="210" y="210" text-anchor="middle" font-weight="bold">普通软件测试</text>
    <text x="210" y="230" text-anchor="middle" font-size="9.5">目标：找出并修复缺陷</text>
    <text x="610" y="210" text-anchor="middle" font-weight="bold">软件可靠性测试</text>
    <text x="610" y="230" text-anchor="middle" font-size="9.5">目标：获取可靠性数据、定量评价可靠性水平</text>
  </g>

  <line x1="20" y1="258" x2="800" y2="258" stroke="#e5e7eb"/>

  <!-- 9.6 三步骤 -->
  <text x="20" y="282" font-size="12.5" font-weight="bold" fill="#14532d">🔴 9.6 可靠性评价三步骤</text>
  <g font-size="10.5" text-anchor="middle">
    <g stroke="#6ee7b7" fill="#ecfdf5">
      <rect x="20" y="292" width="240" height="60" rx="6"/>
      <rect x="290" y="292" width="240" height="60" rx="6"/>
      <rect x="560" y="292" width="240" height="60" rx="6"/>
    </g>
    <g fill="#14532d">
      <text x="140" y="314" font-weight="bold">① 选择可靠性模型</text>
      <text x="140" y="334" font-size="9">从 9.2.4 十类模型中选用或建立</text>
      <text x="410" y="314" font-weight="bold">② 收集可靠性数据</text>
      <text x="410" y="334" font-size="9">主要是软件失效数据，贯穿全生命周期</text>
      <text x="680" y="314" font-weight="bold">③ 可靠性评估和预测</text>
      <text x="680" y="330" font-size="9">是否达标 / 还需投入多少 /</text>
      <text x="680" y="344" font-size="9">运行期可靠性水平</text>
    </g>
  </g>
  <g stroke="#14532d" stroke-width="1.4" fill="none" marker-end="url(#a96)">
    <line x1="260" y1="322" x2="288" y2="322"/>
    <line x1="530" y1="322" x2="558" y2="322"/>
  </g>
  <defs>
    <marker id="a96" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14532d"/></marker>
  </defs>

  <!-- 整章闭环 -->
  <line x1="20" y1="366" x2="800" y2="366" stroke="#e5e7eb"/>
  <text x="20" y="388" font-size="11.5" font-weight="bold" fill="#4c1d95">整章闭环</text>
  <text x="20" y="410" font-size="11" fill="#4c1d95">9.2 建模（给模型）→ 9.3 管理（定活动）→ 9.4 设计（提高可靠性）→ 9.5 测试（拿数据）→ 9.6 评价（用模型+数据得结论）</text>
</svg>
