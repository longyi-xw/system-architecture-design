<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="820" height="520" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">软件可靠性设计技术全景</text>
  <text x="410" y="45" text-anchor="middle" font-size="10.5" fill="#9ca3af">🔴 设计阶段做可靠性控制 = 最有效、最经济的手段</text>

  <!-- 四大类 -->
  <g stroke="#fca5a5" fill="#fee2e2"><rect x="20" y="58" width="188" height="34" rx="6"/></g>
  <g stroke="#93c5fd" fill="#eff6ff"><rect x="216" y="58" width="188" height="34" rx="6"/></g>
  <g stroke="#c4b5fd" fill="#f5f3ff"><rect x="412" y="58" width="188" height="34" rx="6"/></g>
  <g stroke="#6ee7b7" fill="#ecfdf5"><rect x="608" y="58" width="192" height="34" rx="6"/></g>
  <g font-size="11.5" font-weight="bold" text-anchor="middle">
    <text x="114" y="80" fill="#7f1d1d">① 容错设计</text>
    <text x="310" y="80" fill="#1e3a5f">② 检错设计</text>
    <text x="506" y="80" fill="#4c1d95">③ 降低复杂度设计</text>
    <text x="704" y="80" fill="#14532d">④ 系统配置技术</text>
  </g>
  <text x="410" y="108" text-anchor="middle" font-size="10" fill="#6b7280">①② = 出了错怎么办　｜　③④ = 少出错、出错有备胎</text>

  <line x1="20" y1="120" x2="800" y2="120" stroke="#e5e7eb"/>

  <!-- 恢复块 vs N版本 对比 -->
  <text x="20" y="144" font-size="13" font-weight="bold" fill="#7f1d1d">🔴🔴 经典辨析：恢复块设计 vs N 版本程序设计</text>

  <g stroke="#fca5a5" fill="#fef2f2"><rect x="20" y="154" width="380" height="192" rx="8"/></g>
  <g stroke="#fbbf24" fill="#fffbeb"><rect x="420" y="154" width="380" height="192" rx="8"/></g>

  <text x="210" y="176" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">恢复块设计</text>
  <text x="610" y="176" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#78350f">N 版本程序设计</text>
  <text x="210" y="194" text-anchor="middle" font-size="10" font-style="italic" fill="#991b1b">「一个个试，错了再换下一个」</text>
  <text x="610" y="194" text-anchor="middle" font-size="10" font-style="italic" fill="#92400e">「一起跑，然后投票」</text>

  <!-- 恢复块示意 -->
  <g stroke="#dc2626" fill="#ffffff">
    <rect x="44" y="208" width="76" height="26" rx="4"/>
    <rect x="44" y="242" width="76" height="26" rx="4"/>
    <rect x="44" y="276" width="76" height="26" rx="4"/>
  </g>
  <g font-size="9.5" text-anchor="middle" fill="#7f1d1d">
    <text x="82" y="225">文本 1 ✗</text>
    <text x="82" y="259">文本 2 ✗</text>
    <text x="82" y="293">文本 3 ✓</text>
  </g>
  <g stroke="#dc2626" stroke-width="1.2" fill="none" marker-end="url(#a94)">
    <line x1="82" y1="234" x2="82" y2="240"/>
    <line x1="82" y1="268" x2="82" y2="274"/>
  </g>
  <text x="82" y="320" text-anchor="middle" font-size="9" fill="#991b1b">每时刻只跑一个</text>

  <!-- N版本示意 -->
  <g stroke="#d97706" fill="#ffffff">
    <rect x="444" y="208" width="70" height="26" rx="4"/>
    <rect x="444" y="242" width="70" height="26" rx="4"/>
    <rect x="444" y="276" width="70" height="26" rx="4"/>
  </g>
  <g font-size="9.5" text-anchor="middle" fill="#78350f">
    <text x="479" y="225">版本 1</text>
    <text x="479" y="259">版本 2</text>
    <text x="479" y="293">版本 3</text>
  </g>
  <g stroke="#d97706" fill="#fef3c7"><rect x="534" y="238" width="56" height="34" rx="4"/></g>
  <text x="562" y="259" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#78350f">表决</text>
  <g stroke="#d97706" stroke-width="1.2" fill="none" marker-end="url(#a94b)">
    <line x1="514" y1="221" x2="532" y2="248"/>
    <line x1="514" y1="255" x2="532" y2="255"/>
    <line x1="514" y1="289" x2="532" y2="262"/>
  </g>
  <text x="479" y="320" text-anchor="middle" font-size="9" fill="#92400e">同时跑，多数表决</text>

  <defs>
    <marker id="a94" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#dc2626"/></marker>
    <marker id="a94b" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#d97706"/></marker>
  </defs>

  <!-- 五维对比 -->
  <g font-size="10">
    <g fill="#7f1d1d">
      <text x="140" y="216">运行环境：单机</text>
      <text x="140" y="236">冗余类型：动态冗余</text>
      <text x="140" y="256">错误检查：验证测试程序</text>
      <text x="140" y="276">恢复策略：后向恢复</text>
      <text x="140" y="296">实时性：慢</text>
    </g>
    <g fill="#78350f">
      <text x="612" y="216">运行环境：多机</text>
      <text x="612" y="236">冗余类型：静态冗余</text>
      <text x="612" y="256">错误检查：表决</text>
      <text x="612" y="276">恢复策略：前向恢复</text>
      <text x="612" y="296">实时性：快</text>
    </g>
  </g>
  <text x="20" y="338" font-size="9" fill="#9ca3af">⚠️ 五行对照表为多来源一致的备考资料内容，教材原文是否收录未核实</text>

  <line x1="20" y1="358" x2="800" y2="358" stroke="#e5e7eb"/>

  <!-- 其余三类 -->
  <text x="20" y="380" font-size="12" font-weight="bold" fill="#1e3a5f">② 检错设计四要素</text>
  <g font-size="10" fill="#1e3a5f">
    <text x="20" y="400">检测对象（检测点和内容）· 检测延时（故障→检出）</text>
    <text x="20" y="418">实现方式（判断返回结果/计算运行时间/置状态标志）</text>
    <text x="20" y="436">处理方式（停止运行报警 或 部分继续运行）</text>
  </g>
  <text x="20" y="458" font-size="9.5" fill="#6b7280">容错 = 出错还能接着跑；检错 = 只能发现并报警，代价小但不提供恢复</text>

  <text x="420" y="380" font-size="12" font-weight="bold" fill="#14532d">④ 系统配置技术</text>
  <g font-size="10" fill="#14532d">
    <text x="420" y="400">双机热备：Active/Standby，备机监控准备，数据双写</text>
    <text x="420" y="418">双机互备：各自运行不同应用，互为备机</text>
    <text x="420" y="436">双机双工：两台均活跃，负载均衡</text>
    <text x="420" y="454">服务器集群：故障时应用自动转移到其他结点</text>
  </g>
  <text x="420" y="476" font-size="9.5" fill="#6b7280">记：热备一个干 · 互备各干各 · 双工一起干</text>

  <text x="20" y="500" font-size="10.5" fill="#6b7280">③ 降低复杂度设计：简化结构、缩短代码、优化数据流向（复杂性分模块复杂性 + 结构复杂性）→ 从源头减少缺陷</text>
</svg>
