<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="820" height="500" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">软件可靠性基本概念全景</text>

  <!-- 定义 -->
  <text x="30" y="52" font-size="12.5" font-weight="bold" fill="#1f2937">🔴 定义：规定的条件下 + 规定的时间区间 + 完成规定功能的能力</text>
  <g stroke="#cbd5e1" fill="#f8fafc">
    <rect x="30" y="60" width="245" height="42" rx="6"/>
    <rect x="288" y="60" width="245" height="42" rx="6"/>
    <rect x="546" y="60" width="244" height="42" rx="6"/>
  </g>
  <g font-size="10.5" fill="#334155" text-anchor="middle">
    <text x="152" y="78" font-weight="bold">规定的时间</text>
    <text x="152" y="94" font-size="9">工作与挂起的累计运行时间</text>
    <text x="410" y="78" font-weight="bold">规定的条件</text>
    <text x="410" y="94" font-size="9">硬件环境·软件支持环境·输入域</text>
    <text x="668" y="78" font-weight="bold">所要求的功能</text>
    <text x="668" y="94" font-size="9">功能不同→调用模块不同→可靠性不同</text>
  </g>

  <line x1="30" y1="118" x2="790" y2="118" stroke="#e5e7eb"/>

  <!-- MTTF/MTTR/MTBF 时间轴 -->
  <text x="30" y="142" font-size="12.5" font-weight="bold" fill="#7f1d1d">🔴 MTBF = MTTF + MTTR（一个完整故障周期）</text>

  <line x1="60" y1="186" x2="740" y2="186" stroke="#9ca3af" stroke-width="2"/>
  <!-- 正常运行段 -->
  <rect x="60" y="168" width="420" height="18" fill="#d1fae5" stroke="#6ee7b7"/>
  <!-- 修复段 -->
  <rect x="480" y="168" width="150" height="18" fill="#fee2e2" stroke="#fca5a5"/>
  <!-- 下一段正常 -->
  <rect x="630" y="168" width="110" height="18" fill="#d1fae5" stroke="#6ee7b7"/>

  <g font-size="10" text-anchor="middle">
    <text x="270" y="182" fill="#065f46" font-weight="bold">正常运行（MTTF 平均失效前时间）</text>
    <text x="555" y="182" fill="#991b1b" font-weight="bold">修复（MTTR）</text>
  </g>

  <!-- 故障标记 -->
  <g fill="#dc2626">
    <circle cx="480" cy="186" r="5"/>
    <circle cx="630" cy="186" r="5"/>
  </g>
  <g font-size="9.5" fill="#dc2626" text-anchor="middle">
    <text x="480" y="208">✗ 故障发生</text>
    <text x="630" y="208">✓ 修复完成</text>
  </g>

  <!-- MTBF 跨度 -->
  <g stroke="#7f1d1d" stroke-width="1.5" fill="none">
    <line x1="60" y1="228" x2="630" y2="228"/>
    <line x1="60" y1="222" x2="60" y2="234"/>
    <line x1="630" y1="222" x2="630" y2="234"/>
  </g>
  <text x="345" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">MTBF 平均故障间隔时间</text>

  <line x1="30" y1="262" x2="790" y2="262" stroke="#e5e7eb"/>

  <!-- 软硬件对比 -->
  <text x="30" y="286" font-size="12.5" font-weight="bold" fill="#1e3a5f">🔴 软件可靠性 vs 硬件可靠性（软件不会磨损，坏是因为一开始就写错了）</text>
  <g stroke="#93c5fd" fill="#eff6ff"><rect x="30" y="296" width="370" height="96" rx="6"/></g>
  <g stroke="#fbbf24" fill="#fffbeb"><rect x="420" y="296" width="370" height="96" rx="6"/></g>
  <text x="215" y="314" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e3a5f">软件</text>
  <text x="605" y="314" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#78350f">硬件</text>
  <g font-size="10" fill="#1e3a5f">
    <text x="44" y="334">复杂性高 — 设计错误是失效主因</text>
    <text x="44" y="352">不存在物理退化 — 正确的软件永远可靠</text>
    <text x="44" y="370">唯一 — 复制不改变软件本身</text>
    <text x="44" y="386">版本更新周期快</text>
  </g>
  <g font-size="10" fill="#78350f">
    <text x="434" y="334">相对简单</text>
    <text x="434" y="352">主要因物理退化（磨损老化）失效</text>
    <text x="434" y="370">任何两个不可能绝对相同</text>
    <text x="434" y="386">更新周期慢，定型后一般不改</text>
  </g>

  <!-- 系统可靠度 -->
  <text x="30" y="418" font-size="12.5" font-weight="bold" fill="#14532d">🔴 系统可靠度计算（呼应第2章2.9）</text>
  <g stroke="#6ee7b7" fill="#ecfdf5">
    <rect x="30" y="428" width="245" height="46" rx="6"/>
    <rect x="288" y="428" width="245" height="46" rx="6"/>
    <rect x="546" y="428" width="244" height="46" rx="6"/>
  </g>
  <g font-size="10.5" fill="#14532d" text-anchor="middle">
    <text x="152" y="446" font-weight="bold">串联：R = R₁×R₂×…×Rₙ</text>
    <text x="152" y="463" font-size="9">全部正常才正常（连乘，越串越差）</text>
    <text x="410" y="446" font-weight="bold">并联：R = 1−∏(1−Rᵢ)</text>
    <text x="410" y="463" font-size="9">有一个正常就正常（算"全坏"的补集）</text>
    <text x="668" y="446" font-weight="bold">混联：先并后串</text>
    <text x="668" y="463" font-size="9">由内向外逐层化简</text>
  </g>

  <text x="30" y="492" font-size="10" fill="#6b7280">⚠️ 软考特有度量式：可靠性=MTTF/(1+MTTF)、可用性=MTBF/(1+MTBF)、可维护性=1/(1+MTTR)，按题给公式套用，勿与 MTTF/(MTTF+MTTR) 混用</text>
</svg>
