<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <marker id="f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="500" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">层次式体系结构（13.1）· 表现层框架设计（13.2）</text>

  <!-- 左：四层架构 -->
  <rect x="20" y="42" width="292" height="440" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <rect x="20" y="42" width="292" height="28" rx="8" fill="#134e4a"/>
  <text x="166" y="61" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">🔴 13.1 常用四层架构</text>
  <text x="166" y="84" text-anchor="middle" font-size="9.5" fill="#0f766e">每一层<tspan font-weight="bold">为上层服务</tspan>，并<tspan font-weight="bold">作为下层客户</tspan></text>
  <text x="166" y="99" text-anchor="middle" font-size="9.5" fill="#0f766e">每层最多只影响两层 ｜ 接口不变则实现可换</text>

  <g>
    <rect x="36" y="110" width="260" height="38" rx="5" fill="#ffffff" stroke="#14b8a6"/>
    <text x="50" y="127" font-size="11" font-weight="bold" fill="#134e4a">① 表现层（展示层）</text>
    <text x="50" y="141" font-size="9" fill="#6b7280">与用户交互、呈现数据 → 13.2</text>
    <rect x="36" y="154" width="260" height="38" rx="5" fill="#ffffff" stroke="#14b8a6"/>
    <text x="50" y="171" font-size="11" font-weight="bold" fill="#134e4a">② 中间层（业务层）</text>
    <text x="50" y="185" font-size="9" fill="#6b7280">承载业务逻辑 → 13.3</text>
    <rect x="36" y="198" width="260" height="38" rx="5" fill="#ffffff" stroke="#14b8a6"/>
    <text x="50" y="215" font-size="11" font-weight="bold" fill="#134e4a">③ 数据访问层（持久层）</text>
    <text x="50" y="229" font-size="9" fill="#6b7280">访问数据、屏蔽存储细节 → 13.4</text>
    <rect x="36" y="242" width="260" height="38" rx="5" fill="#ffffff" stroke="#14b8a6"/>
    <text x="50" y="259" font-size="11" font-weight="bold" fill="#134e4a">④ 数据层</text>
    <text x="50" y="273" font-size="9" fill="#6b7280">实际的数据存储 → 13.5</text>
  </g>
  <g stroke="#0f766e" stroke-width="1.3" fill="none" marker-end="url(#f1)">
    <line x1="306" y1="129" x2="306" y2="152"/>
    <line x1="306" y1="173" x2="306" y2="196"/>
    <line x1="306" y1="217" x2="306" y2="240"/>
  </g>

  <rect x="36" y="292" width="260" height="30" rx="4" fill="#fef2f2" stroke="#ef4444"/>
  <text x="166" y="311" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">⚠️ 主线索笔误：首项写成「数据层」，应为「表现层」</text>

  <text x="36" y="342" font-size="10.5" font-weight="bold" fill="#a16207">🟡 优点</text>
  <g font-size="9.5" fill="#374151">
    <text x="36" y="359">· 设计简化、系统结构清晰</text>
    <text x="36" y="375">· 便于明确组件的角色与职责</text>
    <text x="36" y="391">· 便于开发、测试、管理和维护</text>
    <text x="36" y="407">· 为软件重用提供强大支持</text>
  </g>
  <rect x="36" y="418" width="260" height="48" rx="4" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="48" y="435" font-size="10" font-weight="bold" fill="#92400e">⚠️ 风险：污水池反模式</text>
  <text x="48" y="450" font-size="9" fill="#374151">请求穿层而过却不做任何实际处理，</text>
  <text x="48" y="462" font-size="9" fill="#374151">白付分层代价；分层也可能使应用变庞大</text>

  <!-- 右上：三种表现层设计模式 -->
  <rect x="324" y="42" width="476" height="248" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <rect x="324" y="42" width="476" height="28" rx="8" fill="#312e81"/>
  <text x="562" y="61" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">🔴 13.2 表现层设计模式：MVC → MVP → MVVM</text>

  <!-- MVC -->
  <rect x="336" y="80" width="148" height="168" rx="6" fill="#ffffff" stroke="#818cf8"/>
  <text x="410" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#312e81">MVC</text>
  <g font-size="9.5">
    <rect x="352" y="106" width="116" height="26" rx="4" fill="#eef2ff" stroke="#6366f1"/>
    <text x="410" y="123" text-anchor="middle" fill="#312e81">View 视图</text>
    <rect x="352" y="150" width="116" height="26" rx="4" fill="#eef2ff" stroke="#6366f1"/>
    <text x="410" y="167" text-anchor="middle" fill="#312e81">Controller 控制器</text>
    <rect x="352" y="194" width="116" height="26" rx="4" fill="#eef2ff" stroke="#6366f1"/>
    <text x="410" y="211" text-anchor="middle" fill="#312e81">Model 模型</text>
  </g>
  <g stroke="#6366f1" stroke-width="1.2" fill="none" marker-end="url(#f2)">
    <line x1="410" y1="132" x2="410" y2="147"/>
    <line x1="410" y1="176" x2="410" y2="191"/>
  </g>
  <path d="M 352 207 H 342 V 119 H 350" stroke="#dc2626" stroke-width="1.3" fill="none" stroke-dasharray="3 2" marker-end="url(#f3)"/>
  <text x="410" y="238" text-anchor="middle" font-size="9" font-weight="bold" fill="#991b1b">V 与 M 可直接通信 → 耦合</text>

  <!-- MVP -->
  <rect x="490" y="80" width="148" height="168" rx="6" fill="#ffffff" stroke="#818cf8"/>
  <text x="564" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#312e81">MVP</text>
  <g font-size="9.5">
    <rect x="506" y="106" width="116" height="26" rx="4" fill="#eef2ff" stroke="#6366f1"/>
    <text x="564" y="123" text-anchor="middle" fill="#312e81">View 视图</text>
    <rect x="506" y="150" width="116" height="26" rx="4" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="564" y="167" text-anchor="middle" font-weight="bold" fill="#312e81">Presenter</text>
    <rect x="506" y="194" width="116" height="26" rx="4" fill="#eef2ff" stroke="#6366f1"/>
    <text x="564" y="211" text-anchor="middle" fill="#312e81">Model 模型</text>
  </g>
  <g stroke="#6366f1" stroke-width="1.2" fill="none" marker-start="url(#f2)" marker-end="url(#f2)">
    <line x1="564" y1="134" x2="564" y2="148"/>
    <line x1="564" y1="178" x2="564" y2="192"/>
  </g>
  <path d="M 506 207 H 496 V 119 H 504" stroke="#9ca3af" stroke-width="1.2" fill="none" stroke-dasharray="3 2"/>
  <line x1="490" y1="155" x2="502" y2="167" stroke="#dc2626" stroke-width="1.6"/>
  <line x1="502" y1="155" x2="490" y2="167" stroke="#dc2626" stroke-width="1.6"/>
  <text x="564" y="238" text-anchor="middle" font-size="9" font-weight="bold" fill="#3730a3">V 不直接使用 M，必过 Presenter</text>

  <!-- MVVM -->
  <rect x="644" y="80" width="148" height="168" rx="6" fill="#ffffff" stroke="#818cf8"/>
  <text x="718" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#312e81">MVVM</text>
  <g font-size="9.5">
    <rect x="660" y="106" width="116" height="26" rx="4" fill="#eef2ff" stroke="#6366f1"/>
    <text x="718" y="123" text-anchor="middle" fill="#312e81">View 视图</text>
    <rect x="660" y="150" width="116" height="26" rx="4" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="718" y="167" text-anchor="middle" font-weight="bold" fill="#312e81">ViewModel</text>
    <rect x="660" y="194" width="116" height="26" rx="4" fill="#eef2ff" stroke="#6366f1"/>
    <text x="718" y="211" text-anchor="middle" fill="#312e81">Model 模型</text>
  </g>
  <g stroke="#6366f1" stroke-width="1.6" fill="none" marker-start="url(#f2)" marker-end="url(#f2)">
    <line x1="718" y1="134" x2="718" y2="148"/>
    <line x1="718" y1="178" x2="718" y2="192"/>
  </g>
  <text x="718" y="238" text-anchor="middle" font-size="9" font-weight="bold" fill="#3730a3">DataBinding 双向绑定，自动同步</text>
  <text x="562" y="264" text-anchor="middle" font-size="10" font-style="italic" fill="#4338ca">演进：单向通信（可直连）→ 完全分离 → 双向绑定；MVVM 为解决 MVP「UI 多、接口增」而生</text>
  <text x="562" y="281" text-anchor="middle" font-size="9.5" fill="#6b7280">三者共同目标：分离显示部分与业务处理部分（视图与模型分离）</text>

  <!-- 右下：UIP + 动态生成 -->
  <rect x="324" y="300" width="234" height="182" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <rect x="324" y="300" width="234" height="26" rx="8" fill="#7c2d12"/>
  <text x="441" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">🔴 UIP 设计思想</text>
  <text x="336" y="340" font-size="9" fill="#9a3412">微软开源 Application Block，简化</text>
  <text x="336" y="353" font-size="9" fill="#9a3412">「用户界面 ↔ 商业逻辑」的分离</text>
  <g>
    <rect x="336" y="362" width="210" height="46" rx="4" fill="#ffffff" stroke="#f97316"/>
    <text x="348" y="379" font-size="10" font-weight="bold" fill="#9a3412">UIC · 界面组件</text>
    <text x="348" y="396" font-size="9" fill="#374151">用户数据获取与结果返回＝界面本身</text>
    <rect x="336" y="414" width="210" height="58" rx="4" fill="#ffffff" stroke="#f97316"/>
    <text x="348" y="431" font-size="10" font-weight="bold" fill="#9a3412">UIPC · 界面流程组件</text>
    <text x="348" y="447" font-size="9" fill="#374151">协调界面各部分配合后台活动</text>
    <text x="348" y="462" font-size="9" fill="#374151">管信息流·事务·异常，交互流程与设备分离</text>
  </g>

  <rect x="570" y="300" width="230" height="182" rx="8" fill="#faf5ff" stroke="#d8b4fe"/>
  <rect x="570" y="300" width="230" height="26" rx="8" fill="#4c1d95"/>
  <text x="685" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">🟡 XML 设计 + 动态生成</text>
  <text x="582" y="340" font-size="9" fill="#6d28d9">XML 优点：树形支持控件层次 · 标记无</text>
  <text x="582" y="353" font-size="9" fill="#6d28d9">限制可自由约定 · 统一 Web/Windows 外观</text>
  <g font-size="9">
    <rect x="582" y="362" width="206" height="26" rx="4" fill="#ffffff" stroke="#a855f7"/>
    <text x="594" y="379" fill="#4c1d95"><tspan font-weight="bold">界面配置</tspan> — 静态定义，读配置初始值</text>
    <rect x="582" y="392" width="206" height="26" rx="4" fill="#ffffff" stroke="#a855f7"/>
    <text x="594" y="409" fill="#4c1d95"><tspan font-weight="bold">界面动态生成</tspan> — 运行时由元素构建</text>
    <rect x="582" y="422" width="206" height="26" rx="4" fill="#ffffff" stroke="#a855f7"/>
    <text x="594" y="439" fill="#4c1d95"><tspan font-weight="bold">界面定制</tspan> — 运行时改属性并保存</text>
  </g>
  <text x="685" y="466" text-anchor="middle" font-size="8.5" fill="#6b7280">DOM API 读 XML → 数据访问类读库 → 动态生成界面</text>
</svg>
