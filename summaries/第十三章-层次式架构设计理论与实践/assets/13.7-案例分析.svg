<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="i1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="420" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">层次式架构案例分析（13.7）</text>
  <text x="410" y="45" text-anchor="middle" font-size="10.5" fill="#6b7280">两个案例各验证一条主线：PetShop → 四层分层 ｜ 电子小票 → 物联网三层</text>

  <!-- 左：PetShop -->
  <rect x="20" y="60" width="390" height="340" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="20" y="60" width="390" height="28" rx="8" fill="#1e3a5f"/>
  <text x="215" y="79" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">13.7.1 电子商务网站 PetShop（B/S 架构）</text>

  <g font-size="9.5">
    <rect x="36" y="100" width="358" height="34" rx="4" fill="#ffffff" stroke="#3b82f6"/>
    <text x="48" y="121" fill="#1e3a5f"><tspan font-weight="bold">表现层</tspan> — Web 界面（B/S）</text>
    <rect x="36" y="142" width="358" height="34" rx="4" fill="#ffffff" stroke="#3b82f6"/>
    <text x="48" y="163" fill="#1e3a5f"><tspan font-weight="bold">业务逻辑层</tspan> — 通过接口模块调用数据访问层</text>
    <rect x="36" y="184" width="358" height="46" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="48" y="203" fill="#1e3a5f"><tspan font-weight="bold">数据访问层</tspan>（PetShop 3.0 把它<tspan font-weight="bold">独立成单独一层</tspan>）</text>
    <text x="48" y="220" fill="#374151">面向接口编程 + <tspan font-weight="bold">IDAL 模块</tspan> → 数据库迁移灵活</text>
    <rect x="36" y="238" width="358" height="34" rx="4" fill="#ffffff" stroke="#3b82f6"/>
    <text x="48" y="259" fill="#1e3a5f"><tspan font-weight="bold">数据层</tspan> — 可替换的数据库实现</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.2" fill="none" marker-end="url(#i1)">
    <line x1="215" y1="134" x2="215" y2="140"/>
    <line x1="215" y1="176" x2="215" y2="182"/>
    <line x1="215" y1="230" x2="215" y2="236"/>
  </g>
  <rect x="36" y="284" width="358" height="30" rx="4" fill="#fef2f2" stroke="#ef4444"/>
  <text x="215" y="303" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">核心思想：面向接口编程 → 层与层之间「松散耦合」</text>
  <text x="36" y="334" font-size="10" font-weight="bold" fill="#1e3a5f">版本节点</text>
  <text x="36" y="352" font-size="9.5" fill="#374151">· <tspan font-weight="bold">3.0</tspan>：数据访问逻辑独立出来作为单独的一层</text>
  <text x="36" y="370" font-size="9.5" fill="#374151">· <tspan font-weight="bold">4.0</tspan>：引入缓存、异步处理机制及 MemberShip 功能</text>
  <text x="36" y="390" font-size="9" font-style="italic" fill="#6b7280">呼应 13.1 四层划分 · 13.3.1 组件以 DAO 为基础 · 13.4.2 工厂模式</text>

  <!-- 右：电子小票 -->
  <rect x="420" y="60" width="380" height="340" rx="8" fill="#f0f9ff" stroke="#7dd3fc"/>
  <rect x="420" y="60" width="380" height="28" rx="8" fill="#075985"/>
  <text x="610" y="79" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">13.7.2 基于物联网架构的电子小票服务系统</text>

  <g>
    <rect x="436" y="100" width="348" height="66" rx="5" fill="#ffffff" stroke="#0ea5e9"/>
    <text x="448" y="120" font-size="11" font-weight="bold" fill="#075985">应用层 ·「用」</text>
    <text x="448" y="138" font-size="9.5" fill="#374151">实时推送 · 历史查询 · 数据管理</text>
    <text x="448" y="155" font-size="9.5" fill="#374151">通过<tspan font-weight="bold">微信公众平台</tspan>与消费者交互</text>
  </g>
  <g>
    <rect x="436" y="178" width="348" height="60" rx="5" fill="#ffffff" stroke="#0ea5e9"/>
    <text x="448" y="198" font-size="11" font-weight="bold" fill="#075985">网络层 ·「传」</text>
    <text x="448" y="216" font-size="9.5" fill="#374151"><tspan font-weight="bold">云平台</tspan>提供数据传输、处理与存储服务</text>
    <text x="448" y="231" font-size="9" fill="#6b7280">对应 13.6「传递信息和处理信息」</text>
  </g>
  <g>
    <rect x="436" y="250" width="348" height="66" rx="5" fill="#ffffff" stroke="#0ea5e9"/>
    <text x="448" y="270" font-size="11" font-weight="bold" fill="#075985">感知层 ·「采」</text>
    <text x="448" y="288" font-size="9.5" fill="#374151"><tspan font-weight="bold">智能硬件取代传统打印机</tspan></text>
    <text x="448" y="305" font-size="9.5" fill="#374151">通过 <tspan font-weight="bold">Wi-Fi / GPRS</tspan> 传输</text>
  </g>
  <g stroke="#6b7280" stroke-width="1.4" fill="none" marker-end="url(#i1)">
    <line x1="610" y1="250" x2="610" y2="242"/>
    <line x1="610" y1="178" x2="610" y2="170"/>
  </g>
  <rect x="436" y="330" width="348" height="30" rx="4" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="610" y="349" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">卖点：商家无需改造现有收银系统</text>
  <text x="436" y="380" font-size="9.5" fill="#374151">系统组成：硬件控制器 + TFT LCD 显示屏 + 无线模块</text>
  <text x="436" y="396" font-size="9" font-style="italic" fill="#6b7280">恰好是 13.6 的「采 → 传 → 用」三层</text>
</svg>
