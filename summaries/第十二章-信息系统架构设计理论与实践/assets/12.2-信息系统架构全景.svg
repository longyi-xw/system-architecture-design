<svg xmlns="http://www.w3.org/2000/svg" width="820" height="620" viewBox="0 0 820 620" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="620" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">信息系统架构全景（12.2）· 本章分量最重的一节</text>

  <!-- 上：架构分类 -->
  <rect x="20" y="40" width="380" height="170" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="20" y="40" width="380" height="28" rx="8" fill="#1e3a5f"/>
  <text x="210" y="59" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">🔴 12.2.2 物理结构（按拓扑）</text>
  <g>
    <rect x="34" y="78" width="352" height="58" rx="4" fill="#ffffff" stroke="#3b82f6"/>
    <text x="46" y="95" font-size="11" font-weight="bold" fill="#1e3a5f">集中式结构 — 资源堆一处</text>
    <text x="46" y="111" font-size="9.5" fill="#374151">✅ 资源集中易管理、利用率高（典型＝单机系统）</text>
    <text x="46" y="127" font-size="9.5" fill="#374151">❌ 维护困难、系统脆弱（单点）→ 现已少用</text>
  </g>
  <g>
    <rect x="34" y="142" width="352" height="58" rx="4" fill="#ffffff" stroke="#3b82f6"/>
    <text x="46" y="159" font-size="11" font-weight="bold" fill="#1e3a5f">分布式结构 — 资源摊开放</text>
    <text x="46" y="175" font-size="9.5" fill="#374151">✅ 配置灵活 · 应变能力强 · 扩展性好 · 安全性好</text>
    <text x="46" y="191" font-size="9.5" fill="#374151">❌ 资源分散 · 标准不统一 · 协调困难 ｜ 分：一般分布式 / 客户机-服务器</text>
  </g>

  <rect x="420" y="40" width="380" height="170" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <rect x="420" y="40" width="380" height="28" rx="8" fill="#134e4a"/>
  <text x="610" y="59" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">🟡 12.2.2 逻辑结构 + 🟡 12.2.3 一般原理</text>
  <text x="434" y="82" font-size="9.5" fill="#0f766e">逻辑结构＝各功能子系统的综合体（功能综合体 + 概念性框架）</text>
  <g font-size="9.5">
    <g fill="#ffffff" stroke="#14b8a6">
      <rect x="434" y="90" width="352" height="26" rx="4"/>
      <rect x="434" y="120" width="352" height="26" rx="4"/>
      <rect x="434" y="150" width="352" height="26" rx="4"/>
    </g>
    <text x="446" y="107" fill="#134e4a"><tspan font-weight="bold">横向综合</tspan> — 同一管理层次的各职能综合（同层跨职能）</text>
    <text x="446" y="137" fill="#134e4a"><tspan font-weight="bold">纵向综合</tspan> — 某一职能的各管理层次组织在一起（同职能跨层）</text>
    <text x="446" y="167" fill="#134e4a"><tspan font-weight="bold">纵横综合</tspan> — 从信息与处理模型综合，实现信息共享与模块化</text>
  </g>
  <text x="434" y="194" font-size="9.5" fill="#0f766e">一般原理：<tspan font-weight="bold">析出相对稳定的成分与关系</tspan>，在其支持下重组变化部分 → <tspan font-weight="bold">柔性</tspan></text>

  <!-- 中：四种架构模型 -->
  <rect x="20" y="222" width="780" height="166" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <rect x="20" y="222" width="780" height="28" rx="8" fill="#7c2d12"/>
  <text x="410" y="241" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">🔴 12.2.4 常用 4 种架构模型：单机 → C/S → SOA → 企业数据交换总线</text>
  <g font-size="9.5">
    <g fill="#ffffff" stroke="#f97316">
      <rect x="32" y="258" width="174" height="62" rx="4"/>
      <rect x="226" y="258" width="174" height="62" rx="4"/>
      <rect x="420" y="258" width="174" height="62" rx="4"/>
      <rect x="614" y="258" width="174" height="62" rx="4"/>
    </g>
    <text x="44" y="275" font-size="10.5" font-weight="bold" fill="#9a3412">① 单机应用 Standalone</text>
    <text x="44" y="291" fill="#374151">单台物理机上的独立程序</text>
    <text x="44" y="307" fill="#6b7280">CATIA / AutoCAD / Photoshop</text>
    <text x="238" y="275" font-size="10.5" font-weight="bold" fill="#9a3412">② 客户机/服务器 C/S</text>
    <text x="238" y="291" fill="#374151">最常见模式，基于 TCP/IP</text>
    <text x="238" y="307" fill="#6b7280">进程间通信 → 见下方四大类</text>
    <text x="432" y="275" font-size="10.5" font-weight="bold" fill="#9a3412">③ 面向服务架构 SOA</text>
    <text x="432" y="291" fill="#374151">多层 C/S 系统间需互通而生</text>
    <text x="432" y="307" font-weight="bold" fill="#991b1b">本质＝消息机制 或 RPC</text>
    <text x="626" y="275" font-size="10.5" font-weight="bold" fill="#9a3412">④ 企业数据交换总线</text>
    <text x="626" y="291" fill="#374151">连接器软件系统（中间件/CORBA）</text>
    <text x="626" y="307" fill="#6b7280">银行电信；按配置收发分发</text>
  </g>
  <g stroke="#0284c7" stroke-width="1.3" fill="none" marker-end="url(#c1)">
    <line x1="206" y1="289" x2="222" y2="289"/>
    <line x1="400" y1="289" x2="416" y2="289"/>
    <line x1="594" y1="289" x2="610" y2="289"/>
  </g>

  <text x="32" y="338" font-size="10.5" font-weight="bold" fill="#dc2626">🔴 C/S 模式的四大类（原文）</text>
  <g font-size="9.5">
    <g fill="#fef2f2" stroke="#ef4444">
      <rect x="32" y="346" width="174" height="30" rx="4"/>
      <rect x="226" y="346" width="174" height="30" rx="4"/>
      <rect x="420" y="346" width="174" height="30" rx="4"/>
      <rect x="614" y="346" width="174" height="30" rx="4"/>
    </g>
    <text x="119" y="365" text-anchor="middle" fill="#991b1b">两层 C/S（胖客户端）</text>
    <text x="313" y="365" text-anchor="middle" fill="#991b1b">三层 C/S 与 B/S</text>
    <text x="507" y="365" text-anchor="middle" fill="#991b1b">多层 C/S 结构</text>
    <text x="701" y="365" text-anchor="middle" fill="#991b1b">MVC（模型/视图/控制器）</text>
  </g>

  <!-- 下：企业信息系统总体框架 -->
  <rect x="20" y="400" width="780" height="200" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <rect x="20" y="400" width="780" height="28" rx="8" fill="#4c1d95"/>
  <text x="410" y="419" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">🔴 12.2.5 企业信息系统总体框架（对应企业管理金字塔）</text>

  <g>
    <rect x="150" y="434" width="500" height="36" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="164" y="457" font-size="11" font-weight="bold" fill="#4c1d95">① 战略系统 — 高层决策支持系统 + 企业战略规划体系（提出重组与集成要求）</text>
    <text x="672" y="457" font-size="9.5" font-style="italic" fill="#6d28d9">战略管理层</text>
  </g>
  <g>
    <rect x="110" y="474" width="580" height="36" rx="4" fill="#ffffff" stroke="#8b5cf6"/>
    <text x="124" y="497" font-size="11" font-weight="bold" fill="#4c1d95">② 业务系统 — 生产/销售等业务功能；经 BPR 优化，确定相对稳定的数据</text>
    <text x="700" y="497" font-size="9.5" font-style="italic" fill="#6d28d9">战术管理层</text>
  </g>
  <g>
    <rect x="70" y="514" width="620" height="36" rx="4" fill="#ffffff" stroke="#8b5cf6"/>
    <text x="84" y="537" font-size="11" font-weight="bold" fill="#4c1d95">③ 应用系统 — TPS / MIS / DSS / ES / OAS / CAD·CAPP·CAM / MRPⅡ（→ 第 3 章）</text>
    <text x="700" y="537" font-size="9.5" font-style="italic" fill="#6d28d9">战术管理层</text>
  </g>
  <g>
    <rect x="30" y="554" width="660" height="38" rx="4" fill="#ffffff" stroke="#8b5cf6"/>
    <text x="44" y="571" font-size="11" font-weight="bold" fill="#4c1d95">④ 信息基础设施 — 三部分：机器 · 数据 · 人和制度</text>
    <text x="44" y="586" font-size="9.5" fill="#374151">技术基础设施（计算机/网络/系统软件/协议）· 信息资源设施（数据/交换标准/处理方法）· 管理基础设施（组织结构/分工/制度）</text>
    <text x="700" y="577" font-size="9.5" font-style="italic" fill="#6d28d9">运行管理层</text>
  </g>
</svg>
