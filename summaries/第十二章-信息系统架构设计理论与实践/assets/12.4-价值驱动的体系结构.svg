<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="430" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">价值驱动的体系结构（12.4.1）</text>
  <text x="410" y="45" text-anchor="middle" font-size="10.5" fill="#6b7280">系统存在是为利益相关方创造价值，但价值模型与体系结构策略常被遗忘</text>

  <!-- 价值模型三形式 -->
  <text x="30" y="72" font-size="11.5" font-weight="bold" fill="#dc2626">🔴 价值模型的三种基本形式</text>
  <g>
    <rect x="30" y="82" width="240" height="86" rx="6" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="44" y="102" font-size="11.5" font-weight="bold" fill="#14532d">价值期望值</text>
    <text x="44" y="121" font-size="9.5" fill="#374151">对特定功能的需求：内容（功能）·</text>
    <text x="44" y="136" font-size="9.5" fill="#374151">满意度（质量）· 不同级别质量的实用性</text>
    <text x="44" y="156" font-size="9.5" font-style="italic" fill="#15803d">例：汽车急刹车的快慢与安全性</text>
    <text x="150" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">「我想要什么」</text>
  </g>

  <g>
    <rect x="300" y="82" width="240" height="86" rx="6" fill="#fff7ed" stroke="#f97316"/>
    <text x="314" y="102" font-size="11.5" font-weight="bold" fill="#9a3412">反作用力</text>
    <text x="314" y="121" font-size="9.5" fill="#374151">在实际环境中实现价值的难度；</text>
    <text x="314" y="136" font-size="9.5" fill="#374151">通常期望越高、难度越大</text>
    <text x="314" y="156" font-size="9.5" font-style="italic" fill="#c2410c">例：刹车受路面 / 坡度 / 重量影响</text>
    <text x="420" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#c2410c">「现实拖后腿」</text>
  </g>

  <g>
    <rect x="570" y="82" width="220" height="86" rx="6" fill="#fff7ed" stroke="#f97316"/>
    <text x="584" y="102" font-size="11.5" font-weight="bold" fill="#9a3412">变革催化剂</text>
    <text x="584" y="121" font-size="9.5" fill="#374151">环境中导致价值期望发生</text>
    <text x="584" y="136" font-size="9.5" fill="#374151">变化的事件，或导致不同</text>
    <text x="584" y="151" font-size="9.5" fill="#374151">结果的限制因素</text>
    <text x="680" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#c2410c">「环境变了」</text>
  </g>

  <rect x="300" y="188" width="490" height="26" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="545" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">🔴 反作用力 + 变革催化剂 ＝ 统称「限制因素」</text>

  <!-- 挑战 -->
  <rect x="30" y="230" width="760" height="34" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="410" y="252" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">🟡 体系结构挑战 ＝ 一个或多个「限制因素」使满足「期望值」变得困难</text>
  <g stroke="#b45309" stroke-width="1.4" fill="none" marker-end="url(#e1)">
    <line x1="545" y1="214" x2="545" y2="227"/>
    <line x1="150" y1="188" x2="150" y2="227"/>
  </g>

  <!-- 起点四步 + 优先化四标准 -->
  <rect x="30" y="278" width="370" height="132" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="30" y="278" width="370" height="26" rx="8" fill="#1e3a5f"/>
  <text x="215" y="296" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">制定体系结构策略的四个起点</text>
  <g font-size="9.5" fill="#374151">
    <text x="44" y="322">① 识别合适的<tspan font-weight="bold">价值背景</tspan>并优先化</text>
    <text x="44" y="344">② 在每个背景中定义<tspan font-weight="bold">效用曲线</tspan>、优先化期望值</text>
    <text x="44" y="366">③ 识别和分析<tspan font-weight="bold">反作用力与变革催化剂</tspan></text>
    <text x="44" y="388">④ 检测<tspan font-weight="bold">限制因素</tspan>使满足期望值变难的领域</text>
  </g>

  <rect x="420" y="278" width="370" height="132" rx="8" fill="#faf5ff" stroke="#d8b4fe"/>
  <rect x="420" y="278" width="370" height="26" rx="8" fill="#4c1d95"/>
  <text x="605" y="296" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">🟡 优先化四标准 + 策略四领域</text>
  <g font-size="9.5" fill="#374151">
    <text x="434" y="320"><tspan font-weight="bold" fill="#4c1d95">重要性</tspan> 期望值与背景的优先级 ｜ <tspan font-weight="bold" fill="#4c1d95">程度</tspan> 限制因素影响多大</text>
    <text x="434" y="338"><tspan font-weight="bold" fill="#4c1d95">后果</tspan> 可选方案数量与难度差异 ｜ <tspan font-weight="bold" fill="#4c1d95">隔离</tspan> 影响广度（越广越重要）</text>
  </g>
  <line x1="434" y1="348" x2="776" y2="348" stroke="#d8b4fe"/>
  <text x="434" y="366" font-size="9.5" fill="#374151">策略涵盖四领域：<tspan font-weight="bold" fill="#4c1d95">组织 · 操作 · 可变性 · 演变</tspan></text>
  <text x="434" y="386" font-size="9.5" font-weight="bold" fill="#6d28d9">本质＝航船的舵（定方向）与龙骨（保稳定）</text>
  <text x="434" y="402" font-size="9" fill="#6b7280">要求：简短 · 高标准 · 所有利益相关者都懂 · 生存期内相对稳定</text>
</svg>
