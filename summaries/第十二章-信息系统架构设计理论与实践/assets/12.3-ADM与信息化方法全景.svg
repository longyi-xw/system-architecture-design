<svg xmlns="http://www.w3.org/2000/svg" width="820" height="610" viewBox="0 0 820 610" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="d1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="d2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="610" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">信息系统架构设计方法（12.3）</text>

  <!-- 左：ADM 环 -->
  <rect x="20" y="42" width="368" height="452" rx="8" fill="#faf5ff" stroke="#d8b4fe"/>
  <rect x="20" y="42" width="368" height="28" rx="8" fill="#4c1d95"/>
  <text x="204" y="61" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">🔴 12.3.1 TOGAF · ADM 十阶段环形迭代</text>
  <text x="204" y="84" text-anchor="middle" font-size="9.5" fill="#6d28d9">ADM 是 TOGAF 规范中<tspan font-weight="bold">最核心</tspan>的内容 ｜ 通用架构→行业架构→组织特定架构</text>

  <!-- 准备阶段 -->
  <rect x="36" y="96" width="118" height="28" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="95" y="115" text-anchor="middle" font-size="10" font-weight="bold" fill="#4c1d95">准备阶段 Preliminary</text>
  <path d="M 154 110 Q 200 110 200 168" stroke="#7c3aed" stroke-width="1.4" fill="none" marker-end="url(#d1)"/>

  <!-- 环形连线 -->
  <circle cx="204" cy="320" r="125" fill="none" stroke="#c4b5fd" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- 中心 需求管理 -->
  <circle cx="204" cy="320" r="47" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
  <text x="204" y="313" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">需求管理</text>
  <text x="204" y="329" text-anchor="middle" font-size="8.5" fill="#991b1b">横跨所有阶段</text>
  <text x="204" y="343" text-anchor="middle" font-size="8.5" fill="#991b1b">＝ADM 流程中心</text>

  <!-- 八阶段 -->
  <g font-size="9">
    <g fill="#ffffff" stroke="#8b5cf6">
      <rect x="161" y="177" width="86" height="36" rx="5"/>
      <rect x="249" y="214" width="86" height="36" rx="5"/>
      <rect x="286" y="302" width="86" height="36" rx="5"/>
      <rect x="249" y="390" width="86" height="36" rx="5"/>
      <rect x="161" y="427" width="86" height="36" rx="5"/>
      <rect x="73" y="390" width="86" height="36" rx="5"/>
      <rect x="36" y="302" width="86" height="36" rx="5"/>
      <rect x="73" y="214" width="86" height="36" rx="5"/>
    </g>
    <text x="204" y="191" text-anchor="middle" font-weight="bold" fill="#4c1d95">A 架构愿景</text>
    <text x="204" y="205" text-anchor="middle" fill="#6b7280">范围·约束·期望</text>
    <text x="292" y="228" text-anchor="middle" font-weight="bold" fill="#4c1d95">B 业务架构</text>
    <text x="292" y="242" text-anchor="middle" fill="#6b7280">静态+动态特征</text>
    <text x="329" y="316" text-anchor="middle" font-weight="bold" fill="#4c1d95">C 信息系统架构</text>
    <text x="329" y="330" text-anchor="middle" fill="#6b7280">数据 + 应用</text>
    <text x="292" y="404" text-anchor="middle" font-weight="bold" fill="#4c1d95">D 技术架构</text>
    <text x="292" y="418" text-anchor="middle" fill="#6b7280">物理实现</text>
    <text x="204" y="441" text-anchor="middle" font-weight="bold" fill="#991b1b">E 机会及解决方案</text>
    <text x="204" y="455" text-anchor="middle" fill="#991b1b">首个关注实施</text>
    <text x="116" y="404" text-anchor="middle" font-weight="bold" fill="#4c1d95">F 迁移规划</text>
    <text x="116" y="418" text-anchor="middle" fill="#6b7280">基线→目标</text>
    <text x="79" y="316" text-anchor="middle" font-weight="bold" fill="#4c1d95">G 实施治理</text>
    <text x="79" y="330" text-anchor="middle" fill="#6b7280">架构契约</text>
    <text x="116" y="228" text-anchor="middle" font-weight="bold" fill="#4c1d95">H 架构变更管理</text>
    <text x="116" y="242" text-anchor="middle" fill="#6b7280">可控方式</text>
  </g>
  <text x="204" y="480" text-anchor="middle" font-size="9.5" font-style="italic" fill="#6d28d9">B→C→D 是三层主线：业务架构 → 信息系统架构 → 技术架构</text>

  <!-- 右：12.3.2 -->
  <rect x="400" y="42" width="400" height="552" rx="8" fill="#f0f9ff" stroke="#7dd3fc"/>
  <rect x="400" y="42" width="400" height="28" rx="8" fill="#075985"/>
  <text x="600" y="61" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">12.3.2 信息化总体架构方法</text>

  <text x="414" y="90" font-size="10.5" font-weight="bold" fill="#dc2626">🔴 国家信息化体系六要素：资源·网络·应用·产业·人才·政策</text>
  <g font-size="9">
    <g fill="#ffffff" stroke="#0ea5e9">
      <rect x="414" y="98" width="184" height="26" rx="4"/>
      <rect x="602" y="98" width="184" height="26" rx="4"/>
      <rect x="414" y="128" width="184" height="26" rx="4"/>
      <rect x="602" y="128" width="184" height="26" rx="4"/>
      <rect x="414" y="158" width="184" height="26" rx="4"/>
      <rect x="602" y="158" width="184" height="26" rx="4"/>
    </g>
    <text x="506" y="115" text-anchor="middle" fill="#075985">① 开发利用信息资源</text>
    <text x="694" y="115" text-anchor="middle" fill="#075985">② 建设国家信息网络</text>
    <text x="506" y="145" text-anchor="middle" fill="#075985">③ 推进信息技术应用</text>
    <text x="694" y="145" text-anchor="middle" fill="#075985">④ 发展信息技术和产业</text>
    <text x="506" y="175" text-anchor="middle" fill="#075985">⑤ 培育信息化人才</text>
    <text x="694" y="175" text-anchor="middle" fill="#075985">⑥ 制定完善信息化政策</text>
  </g>

  <text x="414" y="206" font-size="10.5" font-weight="bold" fill="#dc2626">🔴 两种架构模式（无严格边界，互补）</text>
  <g font-size="9">
    <rect x="414" y="214" width="184" height="54" rx="4" fill="#ffffff" stroke="#0ea5e9"/>
    <text x="426" y="230" font-size="10" font-weight="bold" fill="#075985">数据导向架构</text>
    <text x="426" y="245" fill="#374151">盯数据模型与数据质量</text>
    <text x="426" y="259" fill="#6b7280">BI 商业智能 · MDM 主数据管理</text>
    <rect x="602" y="214" width="184" height="54" rx="4" fill="#ffffff" stroke="#0ea5e9"/>
    <text x="614" y="230" font-size="10" font-weight="bold" fill="#075985">流程导向架构</text>
    <text x="614" y="245" fill="#374151">盯端到端流程整合与适应度</text>
    <text x="614" y="259" fill="#6b7280">关键方法＝SOA（易缺完整数据模型）</text>
  </g>

  <text x="414" y="290" font-size="10.5" font-weight="bold" fill="#dc2626">🔴 信息系统生命周期五阶段</text>
  <g font-size="8.5">
    <g fill="#ffffff" stroke="#0284c7">
      <rect x="414" y="298" width="70" height="46" rx="4"/>
      <rect x="490" y="298" width="70" height="46" rx="4"/>
      <rect x="566" y="298" width="70" height="46" rx="4"/>
      <rect x="642" y="298" width="70" height="46" rx="4"/>
      <rect x="718" y="298" width="68" height="46" rx="4"/>
    </g>
    <text x="449" y="315" text-anchor="middle" font-weight="bold" fill="#075985">① 系统规划</text>
    <text x="449" y="329" text-anchor="middle" fill="#6b7280">可行性分析</text>
    <text x="449" y="340" text-anchor="middle" fill="#6b7280">设计任务书</text>
    <text x="525" y="315" text-anchor="middle" font-weight="bold" fill="#991b1b">② 系统分析</text>
    <text x="525" y="329" text-anchor="middle" fill="#991b1b">做什么·逻辑设计</text>
    <text x="525" y="340" text-anchor="middle" fill="#991b1b">关键阶段</text>
    <text x="601" y="315" text-anchor="middle" font-weight="bold" fill="#075985">③ 系统设计</text>
    <text x="601" y="329" text-anchor="middle" fill="#6b7280">怎么做</text>
    <text x="601" y="340" text-anchor="middle" fill="#6b7280">物理设计</text>
    <text x="677" y="315" text-anchor="middle" font-weight="bold" fill="#075985">④ 系统实施</text>
    <text x="677" y="329" text-anchor="middle" fill="#6b7280">安装·编码·培训</text>
    <text x="677" y="340" text-anchor="middle" fill="#6b7280">数据转换</text>
    <text x="752" y="315" text-anchor="middle" font-weight="bold" fill="#075985">⑤ 运行维护</text>
    <text x="752" y="329" text-anchor="middle" fill="#6b7280">定期维护</text>
    <text x="752" y="340" text-anchor="middle" fill="#6b7280">与评价</text>
  </g>
  <g stroke="#0284c7" stroke-width="1.2" fill="none" marker-end="url(#d2)">
    <line x1="484" y1="321" x2="487" y2="321"/>
    <line x1="560" y1="321" x2="563" y2="321"/>
    <line x1="636" y1="321" x2="639" y2="321"/>
    <line x1="712" y1="321" x2="715" y2="321"/>
  </g>

  <text x="414" y="368" font-size="10.5" font-weight="bold" fill="#dc2626">🔴 总体规划三方法：CSF 抓重点 · SST 求全面 · BSP 靠矩阵</text>
  <g font-size="9">
    <rect x="414" y="376" width="372" height="50" rx="4" fill="#ffffff" stroke="#0ea5e9"/>
    <text x="426" y="393" font-size="10" font-weight="bold" fill="#075985">CSF 关键成功因素法</text>
    <text x="426" y="408" fill="#374151">找出实现目标所需的关键信息集合 → <tspan font-weight="bold">抓主要矛盾、突出重点</tspan></text>
    <text x="426" y="421" fill="#6b7280">局限：一般只利于确定管理目标</text>

    <rect x="414" y="432" width="372" height="50" rx="4" fill="#ffffff" stroke="#0ea5e9"/>
    <text x="426" y="449" font-size="10" font-weight="bold" fill="#075985">SST 战略目标集转化法</text>
    <text x="426" y="464" fill="#374151">把组织战略目标集转为信息系统战略目标 → <tspan font-weight="bold">全面、疏漏少</tspan></text>
    <text x="426" y="477" fill="#6b7280">局限：突出重点不如 CSF</text>

    <rect x="414" y="488" width="372" height="50" rx="4" fill="#ffffff" stroke="#0ea5e9"/>
    <text x="426" y="505" font-size="10" font-weight="bold" fill="#075985">BSP 企业系统规划法</text>
    <text x="426" y="520" fill="#374151"><tspan font-weight="bold">自上而下识别</tspan>目标流程数据、<tspan font-weight="bold">自下而上设计</tspan>系统；靠 PO/RD/CU 矩阵</text>
    <text x="426" y="533" fill="#6b7280">中心＝识别企业过程；局限：没有明显的目标引出过程</text>
  </g>
  <text x="600" y="558" text-anchor="middle" font-size="9.5" font-style="italic" fill="#0369a1">🟢 三者合用称 CSB：CSF 定目标 → SST 补全并转化 → BSP 校核并定结构</text>
  <text x="600" y="578" text-anchor="middle" font-size="9" fill="#6b7280">🟡 信息化六大特征：易用性 · 健壮性 · 平台化 · 安全性 · 门户化 · 移动性</text>
</svg>
