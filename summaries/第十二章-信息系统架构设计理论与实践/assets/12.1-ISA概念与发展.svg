<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="440" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">信息系统架构 ISA · 基本概念与发展（12.1）</text>

  <!-- 定义主块 -->
  <rect x="20" y="44" width="780" height="86" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="36" y="64" font-size="12" font-weight="bold" fill="#991b1b">🔴 ISA 定义（主线索原文）</text>
  <text x="36" y="85" font-size="10.5" fill="#374151">对某一特定内容里的<tspan font-weight="bold" fill="#991b1b">信息</tspan>进行 <tspan font-weight="bold" fill="#991b1b">统筹 · 规划 · 设计 · 安排</tspan> 等一系列有机处理的活动</text>
  <text x="36" y="103" font-size="10.5" fill="#374151">主题对象是<tspan font-weight="bold">信息</tspan>；由<tspan font-weight="bold">信息建筑师</tspan>设计结构、决定组织方式与归类</text>
  <text x="36" y="121" font-size="10.5" fill="#374151">目的：让使用者<tspan font-weight="bold" fill="#991b1b">容易寻找与管理</tspan> ｜ 性质：一项<tspan font-weight="bold" fill="#991b1b">艺术与科学</tspan></text>

  <!-- 左：两个层次 -->
  <rect x="20" y="144" width="250" height="120" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <rect x="20" y="144" width="250" height="28" rx="8" fill="#134e4a"/>
  <text x="145" y="163" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">🟡 ISA 的两个层次</text>
  <g font-size="10">
    <rect x="34" y="182" width="222" height="34" rx="4" fill="#ffffff" stroke="#14b8a6"/>
    <text x="46" y="197" font-weight="bold" fill="#134e4a">概念层次</text>
    <text x="46" y="211" fill="#374151">艺术 · 科学 · 方法 · 建设风格</text>
    <rect x="34" y="222" width="222" height="34" rx="4" fill="#ffffff" stroke="#14b8a6"/>
    <text x="46" y="237" font-weight="bold" fill="#134e4a">物理层次</text>
    <text x="46" y="251" fill="#374151">架构工作后产生的物理结构及相互作用</text>
  </g>

  <!-- 中：架构六特征 -->
  <rect x="284" y="144" width="266" height="120" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="284" y="144" width="266" height="28" rx="8" fill="#1e3a5f"/>
  <text x="417" y="163" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">🟡 架构的六项特征</text>
  <g font-size="9.5" fill="#374151">
    <text x="298" y="184">① 是<tspan font-weight="bold">抽象</tspan>，强调元素的「外部可见」属性</text>
    <text x="298" y="200">② 由<tspan font-weight="bold">多个结构</tspan>组成，个别结构不能代表全局</text>
    <text x="298" y="216" font-weight="bold" fill="#1d4ed8">③ 任何软件都存在架构，但不一定有文档</text>
    <text x="298" y="232">④ 元素与行为集合＝<tspan font-weight="bold">静态结构 + 动态行为</tspan></text>
    <text x="298" y="248">⑤ 具「<tspan font-weight="bold">基础</tspan>」性，通用方案且影响深远</text>
    <text x="298" y="260">⑥ 隐含「<tspan font-weight="bold">决策</tspan>」，由架构师依需求与约束设计</text>
  </g>

  <!-- 右：信息的定义 -->
  <rect x="564" y="144" width="236" height="120" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <rect x="564" y="144" width="236" height="28" rx="8" fill="#78350f"/>
  <text x="682" y="163" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">🟢 信息的定义</text>
  <g font-size="10">
    <rect x="578" y="182" width="208" height="34" rx="4" fill="#ffffff" stroke="#f59e0b"/>
    <text x="590" y="197" font-weight="bold" fill="#92400e">维纳（控制论）</text>
    <text x="590" y="211" fill="#374151">既不是物质，也不是能量</text>
    <rect x="578" y="222" width="208" height="34" rx="4" fill="#ffffff" stroke="#f59e0b"/>
    <text x="590" y="237" font-weight="bold" fill="#92400e">香农（信息论）</text>
    <text x="590" y="251" fill="#374151">消除随机不确定性的东西（bit）</text>
  </g>

  <!-- 底：发展历程 -->
  <rect x="20" y="278" width="780" height="146" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <rect x="20" y="278" width="780" height="28" rx="8" fill="#4c1d95"/>
  <text x="410" y="297" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">🟡 发展历程：Zachman（是什么的蓝图）→ FEA（政府落地）→ TOGAF（怎么做的方法）</text>

  <g>
    <rect x="38" y="318" width="228" height="72" rx="6" fill="#ffffff" stroke="#8b5cf6"/>
    <text x="52" y="337" font-size="11" font-weight="bold" fill="#4c1d95">1980 年代中期 · Zachman</text>
    <text x="52" y="354" font-size="9.5" fill="#374151">IBM 的 John Zachman 首先引入</text>
    <text x="52" y="369" font-size="9.5" fill="#374151">「信息系统架构框架」，从 <tspan font-weight="bold">6 个视角</tspan></text>
    <text x="52" y="384" font-size="9.5" fill="#374151">分析企业；其他框架的源泉</text>
  </g>
  <g>
    <rect x="296" y="318" width="228" height="72" rx="6" fill="#ffffff" stroke="#8b5cf6"/>
    <text x="310" y="337" font-size="11" font-weight="bold" fill="#4c1d95">1999 年 · FEA / FEAF</text>
    <text x="310" y="354" font-size="9.5" fill="#374151">美国<tspan font-weight="bold">联邦 CIO 委员会</tspan>公布</text>
    <text x="310" y="369" font-size="9.5" fill="#374151">联邦企业架构框架，指导公共</text>
    <text x="310" y="384" font-size="9.5" fill="#374151">业务流程、技术引入与系统投资</text>
  </g>
  <g>
    <rect x="554" y="318" width="228" height="72" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="568" y="337" font-size="11" font-weight="bold" fill="#4c1d95">当代 · TOGAF</text>
    <text x="568" y="354" font-size="9.5" fill="#374151">The Open Group 架构框架，</text>
    <text x="568" y="369" font-size="9.5" fill="#374151">业界<tspan font-weight="bold">最著名</tspan>的行业标准框架</text>
    <text x="568" y="384" font-size="9.5" font-weight="bold" fill="#6d28d9">→ 其 ADM 是 12.3 节的主角</text>
  </g>
  <g stroke="#0f766e" stroke-width="1.5" fill="none" marker-end="url(#b1)">
    <line x1="266" y1="354" x2="292" y2="354"/>
    <line x1="524" y1="354" x2="550" y2="354"/>
  </g>
  <text x="410" y="410" text-anchor="middle" font-size="9.5" fill="#6b7280">🟢 研究方向：架构描述语言 · 架构描述与表示 · 分析与验证 · 基于架构的维护与演化（→第10章）· 可靠性（→第9章）</text>
</svg>
