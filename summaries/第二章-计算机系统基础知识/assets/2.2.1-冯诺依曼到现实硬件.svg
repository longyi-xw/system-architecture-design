<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="680" height="400" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="340" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">冯·诺依曼结构 → 现实硬件的归并</text>

  <!-- 左列标题 -->
  <text x="150" y="66" text-anchor="middle" font-size="13" fill="#6b7280">冯·诺依曼五大组成</text>
  <!-- 右列标题 -->
  <text x="520" y="66" text-anchor="middle" font-size="13" fill="#6b7280">现实硬件</text>

  <!-- 左列五个盒子 -->
  <g stroke="#3b82f6" fill="#dbeafe">
    <rect x="80" y="80"  width="140" height="42" rx="8"/>
    <rect x="80" y="134" width="140" height="42" rx="8"/>
    <rect x="80" y="196" width="140" height="42" rx="8"/>
    <rect x="80" y="258" width="140" height="42" rx="8"/>
    <rect x="80" y="312" width="140" height="42" rx="8"/>
  </g>
  <g font-size="15" fill="#1e3a5f" text-anchor="middle">
    <text x="150" y="107">运算器</text>
    <text x="150" y="161">控制器</text>
    <text x="150" y="223">存储器</text>
    <text x="150" y="285">输入设备</text>
    <text x="150" y="339">输出设备</text>
  </g>

  <!-- 合并花括号线：运算器+控制器 → 处理器 -->
  <path d="M 228 101 L 260 101 L 260 155 L 228 155" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M 260 128 L 300 128" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- 存储器 → 存储器（不变） -->
  <path d="M 228 217 L 300 217" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowG)"/>

  <!-- 输入+输出 → 总线/接口/外部设备 -->
  <path d="M 228 279 L 260 279 L 260 333 L 228 333" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M 260 306 L 300 306" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- 右列盒子 -->
  <g stroke="#16a34a" fill="#dcfce7">
    <rect x="310" y="107" width="150" height="42" rx="8"/>
    <rect x="310" y="196" width="150" height="42" rx="8"/>
  </g>
  <g font-size="15" fill="#14532d" text-anchor="middle">
    <text x="385" y="134">处理器</text>
    <text x="385" y="223">存储器</text>
  </g>
  <text x="385" y="166" text-anchor="middle" font-size="12" fill="#6b7280">控制单元 + 运算单元集成</text>

  <!-- 输入输出 → 按传输过程：总线 → 接口 → 外部设备 -->
  <g stroke="#16a34a" fill="#dcfce7">
    <rect x="310" y="285" width="90" height="42" rx="8"/>
    <rect x="424" y="285" width="90" height="42" rx="8"/>
    <rect x="538" y="285" width="110" height="42" rx="8"/>
  </g>
  <g font-size="15" fill="#14532d" text-anchor="middle">
    <text x="355" y="312">总线</text>
    <text x="469" y="312">接口</text>
    <text x="593" y="312">外部设备</text>
  </g>
  <path d="M 402 306 L 420 306" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowG)"/>
  <path d="M 516 306 L 534 306" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="479" y="352" text-anchor="middle" font-size="12" fill="#6b7280">按传输过程划分</text>

  <defs>
    <marker id="arrowG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
