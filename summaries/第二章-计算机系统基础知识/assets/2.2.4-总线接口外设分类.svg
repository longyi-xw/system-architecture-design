<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="760" height="440" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">总线 → 接口 → 外部设备：分类展开</text>
  <text x="380" y="46" text-anchor="middle" font-size="11.5" fill="#9ca3af">（承接 2.2.1：输入/输出设备按传输过程归并为这三者）</text>

  <!-- 顶部三个阶段标题（与 2.2.1 图一致的绿色） -->
  <g stroke="#16a34a" fill="#dcfce7">
    <rect x="40"  y="56" width="170" height="36" rx="8"/>
    <rect x="280" y="56" width="170" height="36" rx="8"/>
    <rect x="520" y="56" width="200" height="36" rx="8"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#14532d" text-anchor="middle">
    <text x="125" y="79">总线</text>
    <text x="365" y="79">接口</text>
    <text x="620" y="79">外部设备</text>
  </g>
  <path d="M 213 74 L 277 74" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrowG)"/>
  <path d="M 453 74 L 517 74" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrowG)"/>

  <!-- Lane 1: 总线 -->
  <text x="125" y="112" text-anchor="middle" font-size="12" fill="#6b7280">按位置分类</text>
  <g stroke="#93c5fd" fill="#eff6ff">
    <rect x="40" y="120" width="170" height="34" rx="6"/>
    <rect x="40" y="160" width="170" height="34" rx="6"/>
    <rect x="40" y="200" width="170" height="34" rx="6"/>
  </g>
  <g text-anchor="middle">
    <text x="125" y="134" font-size="12.5" font-weight="bold" fill="#1e3a5f">内总线</text>
    <text x="125" y="147" font-size="10" fill="#6b7280">片内互联，即片上总线</text>
    <text x="125" y="174" font-size="12.5" font-weight="bold" fill="#1e3a5f">系统总线</text>
    <text x="125" y="187" font-size="10" fill="#6b7280">CPU · 主存 · I/O接口</text>
    <text x="125" y="214" font-size="12.5" font-weight="bold" fill="#1e3a5f">外部总线</text>
    <text x="125" y="227" font-size="10" fill="#6b7280">板间/系统间，即通信总线</text>
  </g>

  <text x="125" y="258" text-anchor="middle" font-size="12" fill="#6b7280">按传输方式分类</text>
  <g stroke="#93c5fd" fill="#eff6ff">
    <rect x="40" y="266" width="170" height="34" rx="6"/>
    <rect x="40" y="306" width="170" height="34" rx="6"/>
  </g>
  <g text-anchor="middle">
    <text x="125" y="280" font-size="12.5" font-weight="bold" fill="#1e3a5f">并行总线</text>
    <text x="125" y="293" font-size="10" fill="#6b7280">如 PCI、PCIe、ATA</text>
    <text x="125" y="320" font-size="12.5" font-weight="bold" fill="#1e3a5f">串行总线</text>
    <text x="125" y="333" font-size="10" fill="#6b7280">如 USB、SATA、RS-232…</text>
  </g>

  <!-- Lane 2: 接口 -->
  <text x="365" y="112" text-anchor="middle" font-size="12" fill="#6b7280">标准接口</text>
  <g stroke="#93c5fd" fill="#eff6ff">
    <rect x="280" y="120" width="170" height="30" rx="6"/>
    <rect x="280" y="154" width="170" height="30" rx="6"/>
    <rect x="280" y="188" width="170" height="30" rx="6"/>
    <rect x="280" y="222" width="170" height="34" rx="6"/>
  </g>
  <g text-anchor="middle">
    <text x="365" y="139" font-size="12.5" font-weight="bold" fill="#1e3a5f">显示类接口</text>
    <text x="365" y="173" font-size="12.5" font-weight="bold" fill="#1e3a5f">音频接口</text>
    <text x="365" y="207" font-size="12.5" font-weight="bold" fill="#1e3a5f">网络类接口</text>
    <text x="365" y="238" font-size="12.5" font-weight="bold" fill="#1e3a5f">其他标准接口</text>
    <text x="365" y="251" font-size="9.5" fill="#6b7280">PS/2、USB、SATA、LPT、RS-232</text>
  </g>

  <text x="365" y="272" text-anchor="middle" font-size="12" fill="#6b7280">非标准接口</text>
  <g stroke="#93c5fd" fill="#eff6ff">
    <rect x="280" y="280" width="170" height="30" rx="6"/>
    <rect x="280" y="314" width="170" height="30" rx="6"/>
  </g>
  <g text-anchor="middle">
    <text x="365" y="299" font-size="12.5" font-weight="bold" fill="#1e3a5f">离散量接口</text>
    <text x="365" y="333" font-size="12.5" font-weight="bold" fill="#1e3a5f">A/D 转换接口</text>
  </g>
  <text x="365" y="364" text-anchor="middle" font-size="10.5" fill="#9ca3af">随需求而设计，非通用标准</text>

  <!-- Lane 3: 外部设备 -->
  <text x="620" y="112" text-anchor="middle" font-size="12" fill="#6b7280">按使用场景分类</text>
  <g stroke="#93c5fd" fill="#eff6ff">
    <rect x="520" y="120" width="200" height="36" rx="6"/>
    <rect x="520" y="164" width="200" height="36" rx="6"/>
    <rect x="520" y="208" width="200" height="36" rx="6"/>
  </g>
  <g text-anchor="middle">
    <text x="620" y="135" font-size="12.5" font-weight="bold" fill="#1e3a5f">传统设备</text>
    <text x="620" y="149" font-size="10" fill="#6b7280">键盘 · 鼠标 · 显示器 · 打印机</text>
    <text x="620" y="179" font-size="12.5" font-weight="bold" fill="#1e3a5f">移动设备</text>
    <text x="620" y="193" font-size="10" fill="#6b7280">GPS · 陀螺仪 · 指纹识别</text>
    <text x="620" y="223" font-size="12.5" font-weight="bold" fill="#1e3a5f">工业设备</text>
    <text x="620" y="237" font-size="10" fill="#6b7280">测温仪 · 机械臂等</text>
  </g>
  <text x="620" y="266" text-anchor="middle" font-size="10.5" fill="#9ca3af">非必要设备，但功能上常不可或缺</text>

  <!-- 底部关系说明 -->
  <line x1="30" y1="392" x2="730" y2="392" stroke="#e5e7eb" stroke-width="1"/>
  <text x="380" y="418" text-anchor="middle" font-size="12.5" fill="#374151">接口与总线的关系：一种总线可能存在多种接口（接口是总线之上的通信规则）</text>

  <defs>
    <marker id="arrowG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
