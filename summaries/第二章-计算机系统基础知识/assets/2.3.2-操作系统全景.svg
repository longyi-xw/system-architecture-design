<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="820" height="430" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="410" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">操作系统：作用 · 特征 · 分类</text>

  <!-- 根 -->
  <rect x="340" y="44" width="140" height="38" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="410" y="68" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#1e3a5f">操作系统</text>

  <!-- 根 → 三大分支 -->
  <path d="M 410 82 L 410 96 L 140 96 L 140 108" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#aG3)"/>
  <path d="M 410 82 L 410 108" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#aG3)"/>
  <path d="M 410 82 L 410 96 L 680 96 L 680 108" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#aG3)"/>

  <!-- 三个分支标题 -->
  <g stroke="#16a34a" fill="#dcfce7">
    <rect x="20"  y="110" width="240" height="34" rx="8"/>
    <rect x="290" y="110" width="240" height="34" rx="8"/>
    <rect x="560" y="110" width="240" height="34" rx="8"/>
  </g>
  <g text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">
    <text x="140" y="133">三大作用</text>
    <text x="410" y="133">四大特征</text>
    <text x="680" y="133">七大分类</text>
  </g>

  <!-- 作用 -->
  <g stroke="#93c5fd" fill="#eff6ff">
    <rect x="20" y="156" width="240" height="52" rx="6"/>
    <rect x="20" y="216" width="240" height="52" rx="6"/>
    <rect x="20" y="276" width="240" height="52" rx="6"/>
  </g>
  <g text-anchor="middle">
    <text x="140" y="176" font-size="12.5" font-weight="bold" fill="#1e3a5f">资源管理</text>
    <text x="140" y="196" font-size="10.5" fill="#475569">处理器 / 存储 / 文件 / I&#47;O 设备</text>
    <text x="140" y="236" font-size="12.5" font-weight="bold" fill="#1e3a5f">交互</text>
    <text x="140" y="256" font-size="10.5" fill="#475569">人机界面：用户与计算机通信</text>
    <text x="140" y="296" font-size="12.5" font-weight="bold" fill="#1e3a5f">平台</text>
    <text x="140" y="316" font-size="10.5" fill="#475569">应用程序开发与运行的高效平台</text>
  </g>

  <!-- 特征 -->
  <g stroke="#fbbf24" fill="#fffbeb">
    <rect x="290" y="156" width="240" height="40" rx="6"/>
    <rect x="290" y="204" width="240" height="40" rx="6"/>
    <rect x="290" y="252" width="240" height="40" rx="6"/>
    <rect x="290" y="300" width="240" height="40" rx="6"/>
  </g>
  <g text-anchor="middle">
    <text x="410" y="172" font-size="12.5" font-weight="bold" fill="#78350f">并发性</text>
    <text x="410" y="188" font-size="10.5" fill="#92400e">一段时间内宏观多程序同时运行</text>
    <text x="410" y="220" font-size="12.5" font-weight="bold" fill="#78350f">共享性</text>
    <text x="410" y="236" font-size="10.5" fill="#92400e">资源被多进程共用而非独占</text>
    <text x="410" y="268" font-size="12.5" font-weight="bold" fill="#78350f">虚拟性</text>
    <text x="410" y="284" font-size="10.5" fill="#92400e">一个实体 ↔ 多个逻辑对应物</text>
    <text x="410" y="316" font-size="12.5" font-weight="bold" fill="#78350f">不确定性</text>
    <text x="410" y="332" font-size="10.5" fill="#92400e">进程走走停停，结果可能不唯一</text>
  </g>

  <!-- 分类 -->
  <g stroke="#c4b5fd" fill="#f5f3ff">
    <rect x="560" y="156" width="240" height="26" rx="6"/>
    <rect x="560" y="188" width="240" height="26" rx="6"/>
    <rect x="560" y="220" width="240" height="26" rx="6"/>
    <rect x="560" y="252" width="240" height="26" rx="6"/>
    <rect x="560" y="284" width="240" height="26" rx="6"/>
    <rect x="560" y="316" width="240" height="26" rx="6"/>
    <rect x="560" y="348" width="240" height="26" rx="6"/>
  </g>
  <g font-size="11.5" fill="#4c1d95">
    <text x="574" y="174"><tspan font-weight="bold">批处理</tspan> · 单道 / 多道</text>
    <text x="574" y="206"><tspan font-weight="bold">分时</tspan> · 多路、独立、交互、及时</text>
    <text x="574" y="238"><tspan font-weight="bold">实时</tspan> · 实时控制 / 实时信息处理</text>
    <text x="574" y="270"><tspan font-weight="bold">网络</tspan> · 共享网络资源</text>
    <text x="574" y="302"><tspan font-weight="bold">分布式</tspan> · 各机无主次之分</text>
    <text x="574" y="334"><tspan font-weight="bold">微机</tspan> · Windows / macOS / Linux</text>
    <text x="574" y="366"><tspan font-weight="bold">嵌入式</tspan> · 微型化、可定制、实时…</text>
  </g>

  <line x1="20" y1="390" x2="800" y2="390" stroke="#e5e7eb" stroke-width="1"/>
  <text x="410" y="412" text-anchor="middle" font-size="12" fill="#374151">首要作用：通过 CPU / 存储 / 设备 / 文件管理合理分配资源，改善资源的共享和利用程度</text>

  <defs>
    <marker id="aG3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
