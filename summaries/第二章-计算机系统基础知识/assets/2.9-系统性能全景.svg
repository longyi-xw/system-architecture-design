<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="820" height="440" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">系统性能全景：阿姆达尔 · 基准测试 · RASIS · 指标概览</text>

  <!-- ① 阿姆达尔解决方案 -->
  <text x="20" y="48" font-size="13" font-weight="bold" fill="#7f1d1d">① 阿姆达尔解决方案（🔴 核心计算题）</text>
  <g stroke="#fca5a5" fill="#fee2e2">
    <rect x="20" y="56" width="500" height="42" rx="6"/>
  </g>
  <text x="270" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">加速比 = 1 ÷ [ (1 − 提升部分占比) + 提升部分占比 ÷ 提升倍数 ]</text>
  <text x="536" y="72" font-size="10.5" fill="#78350f">题型：某功能占运行时间 X%，</text>
  <text x="536" y="86" font-size="10.5" fill="#78350f">速度提升至 Y 倍，求整体加速比</text>
  <text x="20" y="112" font-size="10.5" fill="#6b7280">要点：没被优化的部分始终拖后腿——单一部分提升再多倍，总体加速比也有上限</text>

  <line x1="20" y1="126" x2="800" y2="126" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ② 基准测试程序 -->
  <text x="20" y="148" font-size="13" font-weight="bold" fill="#7f1d1d">② 基准测试程序 · 准确度递减（🔴）</text>
  <g font-size="11" text-anchor="middle">
    <rect x="20"  y="156" width="230" height="34" rx="6" fill="#fee2e2" stroke="#f87171"/>
    <rect x="256" y="156" width="180" height="34" rx="6" fill="#fecaca" stroke="#ef4444"/>
    <rect x="442" y="156" width="160" height="34" rx="6" fill="#fca5a5" stroke="#dc2626"/>
    <rect x="608" y="156" width="192" height="34" rx="6" fill="#f87171" stroke="#b91c1c"/>
  </g>
  <g text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7f1d1d">
    <text x="135" y="178">真实的程序</text>
    <text x="346" y="178">核心程序</text>
    <text x="522" y="178">小型基准程序</text>
    <text x="704" y="178">合成基准程序</text>
  </g>
  <text x="410" y="204" text-anchor="middle" font-size="11" fill="#991b1b">← 最准确　　　　　　　　　　　　　　　　　　　　　　　　　最不准确 →</text>
  <text x="20" y="222" font-size="10.5" fill="#78350f">⚠️ 关联基准程序（检索补充）：TPC-C（OLTP）· TPC-D（决策支持）· TPC-E（大型企业信息服务）</text>

  <line x1="20" y1="238" x2="800" y2="238" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ③ RASIS -->
  <text x="20" y="260" font-size="13" font-weight="bold" fill="#1e3a5f">③ RASIS 五特性（术语背诵；R/A 计算见第 9 章）</text>
  <g stroke="#93c5fd" fill="#eff6ff">
    <rect x="20"  y="268" width="150" height="34" rx="6"/>
    <rect x="178" y="268" width="150" height="34" rx="6"/>
    <rect x="336" y="268" width="150" height="34" rx="6"/>
    <rect x="494" y="268" width="150" height="34" rx="6"/>
    <rect x="652" y="268" width="148" height="34" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a5f">
    <text x="95"  y="285">可靠性</text>
    <text x="95"  y="298" font-size="8.5" font-weight="normal">Reliability</text>
    <text x="253" y="285">可用性</text>
    <text x="253" y="298" font-size="8.5" font-weight="normal">Availability</text>
    <text x="411" y="285">可维护性</text>
    <text x="411" y="298" font-size="8.5" font-weight="normal">Serviceability</text>
    <text x="569" y="285">完整性</text>
    <text x="569" y="298" font-size="8.5" font-weight="normal">Integrity</text>
    <text x="726" y="285">安全性</text>
    <text x="726" y="298" font-size="8.5" font-weight="normal">Security</text>
  </g>

  <line x1="20" y1="316" x2="800" y2="316" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ④ 性能指标概览 -->
  <text x="20" y="338" font-size="13" font-weight="bold" fill="#14532d">④ 各类性能指标概览（🟢 了解）</text>
  <g stroke="#6ee7b7" fill="#ecfdf5">
    <rect x="20"  y="346" width="150" height="70" rx="6"/>
    <rect x="178" y="346" width="150" height="70" rx="6"/>
    <rect x="336" y="346" width="150" height="70" rx="6"/>
    <rect x="494" y="346" width="150" height="70" rx="6"/>
    <rect x="652" y="346" width="148" height="70" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#065f46">
    <text x="95"  y="364" font-size="11" font-weight="bold">计算机</text>
    <text x="95"  y="380" font-size="9">主频·运算速度</text>
    <text x="95"  y="393" font-size="9">存储容量·吞吐率</text>
    <text x="253" y="364" font-size="11" font-weight="bold">操作系统</text>
    <text x="253" y="380" font-size="9">上下文切换</text>
    <text x="253" y="393" font-size="9">响应时间·吞吐率</text>
    <text x="411" y="364" font-size="11" font-weight="bold">数据库</text>
    <text x="411" y="380" font-size="9">库/表规模</text>
    <text x="411" y="393" font-size="9">并发事务·最大连接</text>
    <text x="569" y="364" font-size="11" font-weight="bold">Web 服务器</text>
    <text x="569" y="380" font-size="9">最大并发连接</text>
    <text x="569" y="393" font-size="9">响应延迟·吞吐量</text>
    <text x="726" y="364" font-size="11" font-weight="bold">路由/交换</text>
    <text x="726" y="380" font-size="9">吞吐量·丢包率</text>
    <text x="726" y="393" font-size="9">背板能力等⚠️检索</text>
  </g>
</svg>
