<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="820" height="420" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">UML 全景：三要素 · 四事物 · 关系强弱 · 五视图</text>

  <!-- ① 三要素 -->
  <text x="20" y="50" font-size="13" font-weight="bold" fill="#6b7280">① UML 三要素</text>
  <g stroke="#93c5fd" fill="#eff6ff">
    <rect x="20"  y="58" width="253" height="34" rx="6"/>
    <rect x="284" y="58" width="253" height="34" rx="6"/>
    <rect x="548" y="58" width="252" height="34" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a5f">
    <text x="146" y="80">基本构造块（事物+关系）</text>
    <text x="410" y="80">图（构造块的组合规则）</text>
    <text x="674" y="80">公用机制</text>
  </g>

  <!-- ② 四事物 -->
  <text x="20" y="112" font-size="13" font-weight="bold" fill="#6b7280">② 四种事物</text>
  <g stroke="#a7f3d0" fill="#ecfdf5">
    <rect x="20"  y="120" width="190" height="30" rx="6"/>
    <rect x="218" y="120" width="190" height="30" rx="6"/>
    <rect x="416" y="120" width="190" height="30" rx="6"/>
    <rect x="614" y="120" width="186" height="30" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#065f46">
    <text x="115" y="140">结构事物</text>
    <text x="313" y="140">行为事物</text>
    <text x="511" y="140">分组事物</text>
    <text x="707" y="140">注释事物</text>
  </g>

  <!-- ③ 关系强弱（核心考点） -->
  <text x="20" y="172" font-size="13" font-weight="bold" fill="#7f1d1d">③ 六种关系 · 强弱阶梯（🔴 核心考点）</text>
  <g font-size="10.5" text-anchor="middle">
    <rect x="20"  y="182" width="126" height="46" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <rect x="150" y="182" width="126" height="46" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="280" y="182" width="126" height="46" rx="6" fill="#fecaca" stroke="#f87171"/>
    <rect x="410" y="182" width="126" height="46" rx="6" fill="#fca5a5" stroke="#ef4444"/>
    <rect x="540" y="182" width="126" height="46" rx="6" fill="#f87171" stroke="#dc2626"/>
    <rect x="670" y="182" width="130" height="46" rx="6" fill="#ef4444" stroke="#b91c1c"/>
  </g>
  <g text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7f1d1d">
    <text x="83"  y="202">依赖</text>
    <text x="213" y="202">关联</text>
    <text x="343" y="202">聚合</text>
    <text x="473" y="202">组合</text>
    <text x="603" y="202">泛化</text>
    <text x="735" y="202">实现</text>
  </g>
  <g text-anchor="middle" font-size="9" fill="#7f1d1d">
    <text x="83"  y="216">用一下</text>
    <text x="213" y="216">知道彼此</text>
    <text x="343" y="216">部分可独立</text>
    <text x="473" y="216">部分不可独立</text>
    <text x="603" y="216">is-a 继承</text>
    <text x="735" y="216">接口规约</text>
  </g>
  <text x="410" y="242" text-anchor="middle" font-size="11" fill="#991b1b">← 越来越弱　　　　　　　　　　　　　　　　　　　越来越强（泛化=实现，最强）→</text>
  <text x="20" y="260" font-size="10.5" fill="#78350f">⚠️ 聚合/组合是"关联"的两种特例（整体-部分语义），非与关联并列的独立关系；强弱排序为检索补充，待核对教材原文表述</text>

  <line x1="20" y1="276" x2="800" y2="276" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ④ 五视图 -->
  <text x="20" y="298" font-size="13" font-weight="bold" fill="#1e3a5f">④ 五种视图</text>
  <g stroke="#c4b5fd" fill="#f5f3ff">
    <rect x="20"  y="306" width="150" height="56" rx="6"/>
    <rect x="178" y="306" width="150" height="56" rx="6"/>
    <rect x="336" y="306" width="150" height="56" rx="6"/>
    <rect x="494" y="306" width="150" height="56" rx="6"/>
    <rect x="652" y="306" width="148" height="56" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4c1d95">
    <text x="95"  y="326">用例视图</text>
    <text x="253" y="326">逻辑视图</text>
    <text x="411" y="326">进程视图</text>
    <text x="569" y="326">实现视图</text>
    <text x="726" y="326">部署视图</text>
  </g>
  <g text-anchor="middle" font-size="9.5" fill="#5b21b6">
    <text x="95"  y="342">用例图</text>
    <text x="253" y="342">类图/对象图/</text>
    <text x="253" y="354">状态图/顺序图…</text>
    <text x="411" y="342">状态/顺序/合作/</text>
    <text x="411" y="354">活动/构件/配置图</text>
    <text x="569" y="342">构件图</text>
    <text x="726" y="342">配置图</text>
  </g>
  <text x="20" y="382" font-size="10.5" fill="#6b7280">⚠️ "合作图/配置图"为 UML 1.x 旧称，UML 2.0 起分别改称通信图、部署图（检索补充，教材版本用词以原文为准）</text>
  <text x="20" y="400" font-size="11" fill="#374151">真题提示：类图与序列图相关考点约占 UML 分值的一半以上，选择题偏"关系符号辨析"，案例题偏"补全画图"。</text>
</svg>
