<svg xmlns="http://www.w3.org/2000/svg" width="820" height="446" viewBox="0 0 820 446" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="820" height="446" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">文件系统全景</text>

  <!-- ① 文件类型 -->
  <text x="20" y="48" font-size="13" font-weight="bold" fill="#1e3a5f">① 文件的类型（四种划分视角）</text>
  <g stroke="#93c5fd" fill="#eff6ff">
    <rect x="20"  y="56" width="186" height="56" rx="6"/>
    <rect x="218" y="56" width="186" height="56" rx="6"/>
    <rect x="416" y="56" width="186" height="56" rx="6"/>
    <rect x="614" y="56" width="186" height="56" rx="6"/>
  </g>
  <g text-anchor="middle">
    <text x="113" y="74" font-size="11.5" font-weight="bold" fill="#1e3a5f">按性质和用户</text>
    <text x="113" y="92" font-size="10.5" fill="#475569">系统文件 / 库文件</text>
    <text x="113" y="106" font-size="10.5" fill="#475569">用户文件</text>
    <text x="311" y="74" font-size="11.5" font-weight="bold" fill="#1e3a5f">按保存期限</text>
    <text x="311" y="92" font-size="10.5" fill="#475569">临时 / 档案 / 永久</text>
    <text x="509" y="74" font-size="11.5" font-weight="bold" fill="#1e3a5f">按保护方式</text>
    <text x="509" y="92" font-size="10.5" fill="#475569">只读 / 读写 /</text>
    <text x="509" y="106" font-size="10.5" fill="#475569">可执行 / 不保护</text>
    <text x="707" y="74" font-size="11.5" font-weight="bold" fill="#1e3a5f">UNIX 系统</text>
    <text x="707" y="92" font-size="10.5" fill="#475569">普通 / 目录 / 设备</text>
  </g>

  <!-- ② 结构与组织 -->
  <text x="20" y="132" font-size="13" font-weight="bold" fill="#4c1d95">② 文件的结构和组织</text>
  <text x="20" y="160" font-size="11.5" font-weight="bold" fill="#6b7280">逻辑结构</text>
  <g stroke="#c4b5fd" fill="#f5f3ff">
    <rect x="95"  y="140" width="347" height="30" rx="6"/>
    <rect x="453" y="140" width="347" height="30" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#4c1d95">
    <text x="268" y="160">有结构的<tspan font-weight="bold">记录文件</tspan>（一个以上记录构成）</text>
    <text x="626" y="160">无结构的<tspan font-weight="bold">流式文件</tspan>（顺序字符流 / 字节流）</text>
  </g>
  <text x="20" y="198" font-size="11.5" font-weight="bold" fill="#6b7280">物理结构</text>
  <g stroke="#a78bfa" fill="#ede9fe">
    <rect x="95"  y="178" width="229" height="30" rx="6"/>
    <rect x="333" y="178" width="229" height="30" rx="6"/>
    <rect x="571" y="178" width="229" height="30" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#4c1d95">
    <text x="209" y="198"><tspan font-weight="bold">连续（顺序）</tspan>·连续物理块</text>
    <text x="447" y="198"><tspan font-weight="bold">链接（串联）</tspan>·块内设指针</text>
    <text x="685" y="198"><tspan font-weight="bold">索引</tspan>·每文件一张索引表</text>
  </g>

  <!-- ③ 存取与空间管理 -->
  <text x="20" y="230" font-size="13" font-weight="bold" fill="#78350f">③ 存取方法与存储空间管理</text>
  <text x="20" y="258" font-size="11.5" font-weight="bold" fill="#6b7280">存取方法</text>
  <g stroke="#fbbf24" fill="#fffbeb">
    <rect x="95"  y="238" width="347" height="30" rx="6"/>
    <rect x="453" y="238" width="347" height="30" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#78350f">
    <text x="268" y="258"><tspan font-weight="bold">顺序存取</tspan>：按记录先后依次读写</text>
    <text x="626" y="258"><tspan font-weight="bold">随机存取</tspan>：按记录号/位置直接定位</text>
  </g>
  <text x="20" y="294" font-size="11.5" font-weight="bold" fill="#6b7280">空间管理</text>
  <g stroke="#f59e0b" fill="#fef3c7">
    <rect x="95"  y="274" width="168" height="30" rx="6"/>
    <rect x="274" y="274" width="168" height="30" rx="6"/>
    <rect x="453" y="274" width="168" height="30" rx="6"/>
    <rect x="632" y="274" width="168" height="30" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#78350f">
    <text x="179" y="293"><tspan font-weight="bold">空闲区表</tspan>·连续结构</text>
    <text x="358" y="293"><tspan font-weight="bold">位示图</tspan>·0 空闲 1 占用</text>
    <text x="537" y="293"><tspan font-weight="bold">空闲块链</tspan>·不宜大系统</text>
    <text x="716" y="293"><tspan font-weight="bold">成组链接</tspan>·UNIX 采用</text>
  </g>

  <!-- ④ 共享与保护 -->
  <text x="20" y="330" font-size="13" font-weight="bold" fill="#14532d">④ 文件的共享和保护</text>
  <text x="20" y="358" font-size="11.5" font-weight="bold" fill="#6b7280">共享</text>
  <g stroke="#6ee7b7" fill="#ecfdf5">
    <rect x="95"  y="338" width="347" height="30" rx="6"/>
    <rect x="453" y="338" width="347" height="30" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#065f46">
    <text x="268" y="358"><tspan font-weight="bold">硬链接</tspan>：目录表目指向同一索引节点</text>
    <text x="626" y="358"><tspan font-weight="bold">符号链接</tspan>：LINK 文件记录路径名</text>
  </g>
  <text x="20" y="394" font-size="11.5" font-weight="bold" fill="#6b7280">保护</text>
  <g stroke="#34d399" fill="#d1fae5">
    <rect x="95"  y="374" width="168" height="30" rx="6"/>
    <rect x="274" y="374" width="168" height="30" rx="6"/>
    <rect x="453" y="374" width="168" height="30" rx="6"/>
    <rect x="632" y="374" width="168" height="30" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#065f46">
    <text x="179" y="393">存取控制矩阵</text>
    <text x="358" y="393">存取控制表</text>
    <text x="537" y="393">用户权限表</text>
    <text x="716" y="393">密码</text>
  </g>

  <line x1="20" y1="418" x2="800" y2="418" stroke="#e5e7eb" stroke-width="1"/>
  <text x="410" y="436" text-anchor="middle" font-size="12" fill="#374151">文件系统 = 实现文件统一管理的一组软件和相关数据的集合；核心功能是<tspan font-weight="bold">按名存取</tspan>，而非按地址存取</text>
</svg>
