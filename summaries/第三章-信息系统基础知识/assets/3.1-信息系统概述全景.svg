<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="820" height="340" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">信息系统概述：诺兰模型 · 生命周期 · 开发方法</text>

  <!-- ① 诺兰模型 -->
  <text x="20" y="48" font-size="13" font-weight="bold" fill="#6b7280">① 诺兰模型六阶段</text>
  <g stroke="#93c5fd" fill="#eff6ff">
    <rect x="20"  y="56" width="123" height="34" rx="6"/>
    <rect x="151" y="56" width="123" height="34" rx="6"/>
    <rect x="282" y="56" width="123" height="34" rx="6"/>
  </g>
  <g stroke="#a7f3d0" fill="#ecfdf5">
    <rect x="413" y="56" width="123" height="34" rx="6"/>
    <rect x="544" y="56" width="123" height="34" rx="6"/>
    <rect x="675" y="56" width="125" height="34" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="bold">
    <text x="81"  y="78" fill="#1e3a5f">初始阶段</text>
    <text x="212" y="78" fill="#1e3a5f">传播阶段</text>
    <text x="343" y="78" fill="#1e3a5f">控制阶段</text>
    <text x="474" y="78" fill="#065f46">集成阶段</text>
    <text x="605" y="78" fill="#065f46">数据管理阶段</text>
    <text x="737" y="78" fill="#065f46">成熟阶段</text>
  </g>
  <text x="180" y="104" text-anchor="middle" font-size="10.5" fill="#1e3a5f">← 计算机时代 →</text>
  <text x="620" y="104" text-anchor="middle" font-size="10.5" fill="#065f46">← 信息时代 →</text>
  <text x="20" y="122" font-size="10.5" fill="#78350f">⚠️ 控制阶段是转折点：高层开始用投入产出优化法则审视计算机应用（检索补充，待核对）</text>

  <line x1="20" y1="136" x2="800" y2="136" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ② 生命周期 -->
  <text x="20" y="158" font-size="13" font-weight="bold" fill="#7f1d1d">② 信息系统生命周期（四阶段）</text>
  <g stroke="#fca5a5" fill="#fee2e2">
    <rect x="20"  y="166" width="187" height="34" rx="6"/>
    <rect x="217" y="166" width="187" height="34" rx="6"/>
    <rect x="414" y="166" width="187" height="34" rx="6"/>
    <rect x="611" y="166" width="189" height="34" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">
    <text x="113" y="188">产生阶段</text>
    <text x="310" y="188">开发阶段</text>
    <text x="507" y="188">运行阶段</text>
    <text x="705" y="188">消亡阶段</text>
  </g>
  <g stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrowG)">
    <path d="M 207 183 L 216 183"/>
    <path d="M 404 183 L 413 183"/>
    <path d="M 601 183 L 610 183"/>
  </g>

  <line x1="20" y1="214" x2="800" y2="214" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ③ 开发方法 -->
  <text x="20" y="236" font-size="13" font-weight="bold" fill="#78350f">③ 信息系统开发方法（四种）</text>
  <g stroke="#fbbf24" fill="#fffbeb">
    <rect x="20"  y="244" width="190" height="50" rx="6"/>
    <rect x="218" y="244" width="190" height="50" rx="6"/>
    <rect x="416" y="244" width="190" height="50" rx="6"/>
    <rect x="614" y="244" width="186" height="50" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#78350f">
    <text x="115" y="263" font-size="11.5" font-weight="bold">结构化方法</text>
    <text x="115" y="279" font-size="9">目标清晰·阶段程式化</text>
    <text x="313" y="263" font-size="11.5" font-weight="bold">原型法</text>
    <text x="313" y="279" font-size="9">需求→设计→调试→检测</text>
    <text x="511" y="263" font-size="11.5" font-weight="bold">面向对象方法</text>
    <text x="511" y="279" font-size="9">封装·继承·多态</text>
    <text x="707" y="263" font-size="11.5" font-weight="bold">面向服务方法</text>
    <text x="707" y="279" font-size="9">接口定义与实现解耦</text>
  </g>

  <text x="20" y="316" font-size="11" fill="#374151">建设四原则：高层管理人员介入 · 用户参与开发 · 自顶向下规划 · 工程化原则</text>

  <defs>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#ef4444"/>
    </marker>
  </defs>
</svg>
