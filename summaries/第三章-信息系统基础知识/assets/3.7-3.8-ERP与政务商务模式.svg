<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="820" height="330" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">ERP 核心模块 · 电子政务模式 · 电子商务模式</text>

  <!-- ① ERP 核心模块流程 -->
  <text x="20" y="48" font-size="13" font-weight="bold" fill="#6b7280">① ERP 核心模块（生产计划主线，简化）</text>
  <g stroke="#93c5fd" fill="#eff6ff">
    <rect x="20"  y="56" width="126" height="40" rx="6"/>
    <rect x="156" y="56" width="126" height="40" rx="6"/>
    <rect x="292" y="56" width="126" height="40" rx="6"/>
    <rect x="428" y="56" width="126" height="40" rx="6"/>
    <rect x="564" y="56" width="126" height="40" rx="6"/>
    <rect x="700" y="56" width="100" height="40" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1e3a5f">
    <text x="83"  y="72">生产预测</text>
    <text x="83"  y="86" font-size="9" font-weight="normal">/销售计划</text>
    <text x="219" y="72">经营计划</text>
    <text x="219" y="86" font-size="9" font-weight="normal">生产计划大纲</text>
    <text x="355" y="72">MPS</text>
    <text x="355" y="86" font-size="9" font-weight="normal">主生产计划</text>
    <text x="491" y="72">MRP</text>
    <text x="491" y="86" font-size="9" font-weight="normal">物料需求计划</text>
    <text x="627" y="72">CRP</text>
    <text x="627" y="86" font-size="9" font-weight="normal">能力需求计划</text>
    <text x="750" y="72">采购/</text>
    <text x="750" y="86" font-size="9" font-weight="normal">库存/财务</text>
  </g>
  <g stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#arrowI)">
    <path d="M 146 76 L 155 76"/>
    <path d="M 282 76 L 291 76"/>
    <path d="M 418 76 L 427 76"/>
    <path d="M 554 76 L 563 76"/>
    <path d="M 690 76 L 699 76"/>
  </g>
  <text x="20" y="112" font-size="10.5" fill="#475569">本质：全面集成企业物流·资金流·信息流的管理思想（非单纯信息系统）</text>

  <line x1="20" y1="128" x2="800" y2="128" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ② 电子政务 -->
  <text x="20" y="150" font-size="13" font-weight="bold" fill="#78350f">② 电子政务模式（参与方：G 政府 · B 企业 · C 公民/消费者 · E 公务员）</text>
  <g stroke="#fbbf24" fill="#fffbeb">
    <rect x="20"  y="158" width="150" height="40" rx="6"/>
    <rect x="178" y="158" width="150" height="40" rx="6"/>
    <rect x="336" y="158" width="150" height="40" rx="6"/>
    <rect x="494" y="158" width="150" height="40" rx="6"/>
    <rect x="652" y="158" width="148" height="40" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">
    <text x="95"  y="176">G2G</text>
    <text x="95"  y="190" font-size="9" font-weight="normal">政府间</text>
    <text x="253" y="176">G2B / B2G</text>
    <text x="253" y="190" font-size="9" font-weight="normal">政府-企业（招投标）</text>
    <text x="411" y="176">G2C</text>
    <text x="411" y="190" font-size="9" font-weight="normal">政府-公民（证照）</text>
    <text x="569" y="176">C2G</text>
    <text x="569" y="190" font-size="9" font-weight="normal">公民反馈/参政</text>
    <text x="726" y="176">G2E</text>
    <text x="726" y="190" font-size="9" font-weight="normal">政府-公务员</text>
  </g>

  <line x1="20" y1="216" x2="800" y2="216" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ③ 电子商务 -->
  <text x="20" y="238" font-size="13" font-weight="bold" fill="#14532d">③ 电子商务模式</text>
  <g stroke="#6ee7b7" fill="#ecfdf5">
    <rect x="20"  y="246" width="190" height="40" rx="6"/>
    <rect x="218" y="246" width="190" height="40" rx="6"/>
    <rect x="416" y="246" width="190" height="40" rx="6"/>
    <rect x="614" y="246" width="186" height="40" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="bold" fill="#065f46">
    <text x="115" y="264">B2B</text>
    <text x="115" y="278" font-size="9" font-weight="normal">企业对企业·如阿里巴巴</text>
    <text x="313" y="264">B2C</text>
    <text x="313" y="278" font-size="9" font-weight="normal">企业对消费者·如京东</text>
    <text x="511" y="264">C2C</text>
    <text x="511" y="278" font-size="9" font-weight="normal">消费者对消费者·如淘宝</text>
    <text x="707" y="264">C2B / O2O</text>
    <text x="707" y="278" font-size="9" font-weight="normal">扩展模式</text>
  </g>

  <text x="20" y="312" font-size="10.5" fill="#6b7280">⚠️ 本页内容多为检索补充，教材原文措辞与是否完整覆盖以上模式待翻书核对</text>
</svg>
