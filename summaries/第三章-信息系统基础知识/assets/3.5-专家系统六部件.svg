<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="820" height="340" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">专家系统六部件结构</text>

  <!-- 知识获取 (top left) -->
  <rect x="40" y="56" width="140" height="46" rx="6" stroke="#93c5fd" fill="#eff6ff"/>
  <text x="110" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a5f">知识获取</text>

  <!-- 知识库 -->
  <rect x="40" y="140" width="140" height="56" rx="6" stroke="#fca5a5" fill="#fee2e2"/>
  <text x="110" y="164" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">知识库</text>
  <text x="110" y="180" text-anchor="middle" font-size="9.5" fill="#7f1d1d">事实性+启发性知识</text>

  <!-- 综合数据库 -->
  <rect x="640" y="140" width="140" height="56" rx="6" stroke="#fca5a5" fill="#fee2e2"/>
  <text x="710" y="164" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">综合数据库</text>
  <text x="710" y="180" text-anchor="middle" font-size="9.5" fill="#7f1d1d">推理中间结果</text>

  <!-- 推理机 (center) -->
  <rect x="320" y="140" width="180" height="56" rx="6" stroke="#a78bfa" fill="#ede9fe"/>
  <text x="410" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">推理机</text>
  <text x="410" y="180" text-anchor="middle" font-size="9.5" fill="#4c1d95">匹配 · 搜索 · 推理（正/反/双向）</text>

  <!-- 解释程序 (top right) -->
  <rect x="640" y="56" width="140" height="46" rx="6" stroke="#93c5fd" fill="#eff6ff"/>
  <text x="710" y="84" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e3a5f">解释程序</text>

  <!-- 人机接口 (bottom center) -->
  <rect x="320" y="250" width="180" height="46" rx="6" stroke="#6ee7b7" fill="#ecfdf5"/>
  <text x="410" y="278" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#065f46">人机接口</text>

  <!-- 用户/专家 -->
  <text x="410" y="322" text-anchor="middle" font-size="11" fill="#374151">用户　　　领域专家 / 知识工程师</text>

  <!-- 箭头 -->
  <g stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arrowH)">
    <path d="M 110 102 L 110 139"/>
    <path d="M 180 168 L 319 168"/>
    <path d="M 500 168 L 639 168"/>
    <path d="M 710 139 L 710 103"/>
    <path d="M 410 196 L 410 249"/>
  </g>

  <text x="20" y="230" font-size="10.5" fill="#78350f">知识获取 → 知识库；知识库 ↔ 推理机 ↔ 综合数据库；推理机 → 解释程序；推理机 ↔ 人机接口 ↔ 用户/专家</text>

  <defs>
    <marker id="arrowH" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
