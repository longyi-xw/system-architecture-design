<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="820" height="500" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">加解密算法 · 公钥管理 · 访问控制 · 数字签名（🔴 核心考点区）</text>

  <!-- ① 对称/非对称 + 国密 -->
  <text x="20" y="48" font-size="13" font-weight="bold" fill="#7f1d1d">① 对称 / 非对称加密算法 · 国密算法归类</text>
  <g stroke="#fca5a5" fill="#fee2e2">
    <rect x="20"  y="56" width="380" height="60" rx="6"/>
  </g>
  <g stroke="#f87171" fill="#fecaca">
    <rect x="420" y="56" width="380" height="60" rx="6"/>
  </g>
  <text x="210" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">对称加密（一把钥匙锁+开）</text>
  <text x="210" y="94" text-anchor="middle" font-size="10.5" fill="#7f1d1d">DES · 3DES · AES · IDEA</text>
  <text x="210" y="108" text-anchor="middle" font-size="10.5" fill="#7f1d1d">国密：SM1 · SM4 · SM7 · ZUC</text>
  <text x="610" y="76" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7f1d1d">非对称加密（两把钥匙）</text>
  <text x="610" y="94" text-anchor="middle" font-size="10.5" fill="#7f1d1d">RSA · ECC</text>
  <text x="610" y="108" text-anchor="middle" font-size="10.5" fill="#7f1d1d">国密：SM2 · SM9</text>

  <rect x="20" y="124" width="780" height="28" rx="6" stroke="#dc2626" fill="#fecaca"/>
  <text x="410" y="143" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7f1d1d">⚠️ 混淆项：SM3 是摘要（哈希）算法，不属于加密算法！</text>

  <line x1="20" y1="164" x2="800" y2="164" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ② 公钥管理四方式 -->
  <text x="20" y="186" font-size="13" font-weight="bold" fill="#78350f">② 公钥管理四方式（安全性递增）</text>
  <g font-size="10" text-anchor="middle">
    <rect x="20"  y="194" width="186" height="46" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
    <rect x="216" y="194" width="186" height="46" rx="6" fill="#fde68a" stroke="#fbbf24"/>
    <rect x="412" y="194" width="186" height="46" rx="6" fill="#fcd34d" stroke="#f59e0b"/>
    <rect x="608" y="194" width="192" height="46" rx="6" fill="#f59e0b" stroke="#d97706"/>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">
    <text x="113" y="214">公开发布</text>
    <text x="309" y="214">公用目录表</text>
    <text x="505" y="214">公钥管理机构</text>
    <text x="704" y="214">公钥证书</text>
  </g>
  <g text-anchor="middle" font-size="8.5" fill="#78350f">
    <text x="113" y="230">直接广播·易冒充</text>
    <text x="309" y="230">机构维护目录</text>
    <text x="505" y="230">每次在线签名认证</text>
    <text x="704" y="230">离线验证·PKI 主流</text>
  </g>
  <g stroke="#d97706" stroke-width="1.5" fill="none" marker-end="url(#arrowJ)">
    <path d="M 206 217 L 215 217"/>
    <path d="M 402 217 L 411 217"/>
    <path d="M 598 217 L 607 217"/>
  </g>

  <line x1="20" y1="256" x2="800" y2="256" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ③ 访问控制四技术 -->
  <text x="20" y="278" font-size="13" font-weight="bold" fill="#1e3a5f">③ 访问控制四种实现技术</text>
  <g stroke="#93c5fd" fill="#eff6ff">
    <rect x="20"  y="286" width="190" height="56" rx="6"/>
    <rect x="218" y="286" width="190" height="56" rx="6"/>
    <rect x="416" y="286" width="190" height="56" rx="6"/>
    <rect x="614" y="286" width="186" height="56" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#1e3a5f">
    <text x="115" y="306" font-size="11.5" font-weight="bold">访问控制矩阵</text>
    <text x="115" y="322" font-size="9">行=主体·列=客体</text>
    <text x="115" y="334" font-size="9">理论模型，稀疏浪费</text>
    <text x="313" y="306" font-size="11.5" font-weight="bold">访问控制表 ACL</text>
    <text x="313" y="322" font-size="9">矩阵的"列"</text>
    <text x="313" y="334" font-size="9">以客体为中心</text>
    <text x="511" y="306" font-size="11.5" font-weight="bold">能力表</text>
    <text x="511" y="322" font-size="9">矩阵的"行"</text>
    <text x="511" y="334" font-size="9">以主体为中心，与ACL互反</text>
    <text x="707" y="306" font-size="11.5" font-weight="bold">授权关系表</text>
    <text x="707" y="322" font-size="9">(主体,客体,权限)</text>
    <text x="707" y="334" font-size="9">三元组记录</text>
  </g>

  <line x1="20" y1="360" x2="800" y2="360" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ④ 数字签名五条件 -->
  <text x="20" y="382" font-size="13" font-weight="bold" fill="#14532d">④ 数字签名五个条件</text>
  <g stroke="#6ee7b7" fill="#ecfdf5">
    <rect x="20"  y="390" width="150" height="34" rx="6"/>
    <rect x="178" y="390" width="150" height="34" rx="6"/>
    <rect x="336" y="390" width="150" height="34" rx="6"/>
    <rect x="494" y="390" width="150" height="34" rx="6"/>
    <rect x="652" y="390" width="148" height="34" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="10.5" font-weight="bold" fill="#065f46">
    <text x="95"  y="411">可信</text>
    <text x="253" y="411">不可伪造</text>
    <text x="411" y="411">不可重用</text>
    <text x="569" y="411">文件不可改变</text>
    <text x="726" y="411">不可抵赖</text>
  </g>
  <text x="20" y="446" font-size="11" fill="#374151">对称密钥签名 vs 公开密钥签名：两种实现方式，原始材料未展开细节</text>

  <defs>
    <marker id="arrowJ" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#d97706"/>
    </marker>
  </defs>
</svg>
