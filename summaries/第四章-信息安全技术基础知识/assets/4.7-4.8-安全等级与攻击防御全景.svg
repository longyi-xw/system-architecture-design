<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="820" height="300" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">计算机信息系统安全保护等级（GB17859，🔴 经典必考）</text>

  <!-- ① 安全等级五级 -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="20"  y="40" width="152" height="60" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <rect x="176" y="40" width="152" height="60" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="332" y="40" width="152" height="60" rx="6" fill="#fecaca" stroke="#f87171"/>
    <rect x="488" y="40" width="152" height="60" rx="6" fill="#fca5a5" stroke="#ef4444"/>
    <rect x="644" y="40" width="156" height="60" rx="6" fill="#f87171" stroke="#dc2626"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">
    <text x="96"  y="60">第1级</text>
    <text x="252" y="60">第2级</text>
    <text x="408" y="60">第3级</text>
    <text x="564" y="60">第4级</text>
    <text x="722" y="60">第5级</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#7f1d1d">
    <text x="96"  y="76">用户自主</text>
    <text x="96"  y="90">保护级</text>
    <text x="252" y="76">系统审计</text>
    <text x="252" y="90">保护级</text>
    <text x="408" y="76">安全标记</text>
    <text x="408" y="90">保护级</text>
    <text x="564" y="76">结构化</text>
    <text x="564" y="90">保护级</text>
    <text x="722" y="76">访问验证</text>
    <text x="722" y="90">保护级</text>
  </g>
  <g stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arrowK)">
    <path d="M 172 70 L 175 70"/>
    <path d="M 328 70 L 331 70"/>
    <path d="M 484 70 L 487 70"/>
    <path d="M 640 70 L 643 70"/>
  </g>
  <text x="410" y="118" text-anchor="middle" font-size="11" fill="#991b1b">← 防护级别递增：自主访问 → 细粒度审计 → 强制访问控制 → 形式化模型 → 国防级抗渗透 →</text>

  <line x1="20" y1="134" x2="800" y2="134" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ② 攻击类型概览 -->
  <text x="20" y="156" font-size="13" font-weight="bold" fill="#1e3a5f">攻击类型概览（🟡 了解，非本节 🔴 重点）</text>
  <g stroke="#93c5fd" fill="#eff6ff">
    <rect x="20"  y="164" width="186" height="50" rx="6"/>
    <rect x="218" y="164" width="186" height="50" rx="6"/>
    <rect x="416" y="164" width="186" height="50" rx="6"/>
    <rect x="614" y="164" width="186" height="50" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#1e3a5f">
    <text x="113" y="184" font-size="11.5" font-weight="bold">拒绝服务攻击</text>
    <text x="113" y="200" font-size="9">SYN Flooding 等</text>
    <text x="311" y="184" font-size="11.5" font-weight="bold">ARP/DNS/IP 欺骗</text>
    <text x="311" y="200" font-size="9">冒充MAC/域名/源地址</text>
    <text x="509" y="184" font-size="11.5" font-weight="bold">端口扫描</text>
    <text x="509" y="200" font-size="9">TCP Connect / SYN 扫描</text>
    <text x="707" y="184" font-size="11.5" font-weight="bold">漏洞扫描</text>
    <text x="707" y="200" font-size="9">基于网络 / 基于主机</text>
  </g>

  <text x="20" y="240" font-size="11" fill="#374151">安全风险管理三要素：资产（Asset）· 威胁（Threat）· 脆弱性（Vulnerability）</text>
  <text x="20" y="258" font-size="11" fill="#374151">流程：风险评估（识别+分析）→ 风险控制（缓解/转移/接受/规避）→ 持续监控与复审</text>

  <defs>
    <marker id="arrowK" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
