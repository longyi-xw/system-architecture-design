<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="ui-sans-serif, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="820" height="380" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="410" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">需求工程全景（🔴 全节高频考点）</text>

  <!-- ① 需求三层次 -->
  <text x="20" y="48" font-size="13" font-weight="bold" fill="#7f1d1d">① 软件需求三层次</text>
  <g stroke="#fca5a5" fill="#fee2e2">
    <rect x="20"  y="56" width="253" height="36" rx="6"/>
    <rect x="284" y="56" width="253" height="36" rx="6"/>
    <rect x="548" y="56" width="252" height="36" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">
    <text x="146" y="79">业务需求</text>
    <text x="410" y="79">用户需求</text>
    <text x="674" y="79">功能需求（含非功能需求）</text>
  </g>

  <line x1="20" y1="108" x2="800" y2="108" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ② 需求获取六法 -->
  <text x="20" y="130" font-size="13" font-weight="bold" fill="#78350f">② 需求获取六法</text>
  <g stroke="#fbbf24" fill="#fffbeb">
    <rect x="20"  y="138" width="126" height="34" rx="6"/>
    <rect x="152" y="138" width="126" height="34" rx="6"/>
    <rect x="284" y="138" width="126" height="34" rx="6"/>
    <rect x="416" y="138" width="126" height="34" rx="6"/>
    <rect x="548" y="138" width="126" height="34" rx="6"/>
    <rect x="680" y="138" width="120" height="34" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="10.5" font-weight="bold" fill="#78350f">
    <text x="83"  y="159">用户面谈</text>
    <text x="215" y="159">专题讨论会</text>
    <text x="347" y="159">问卷调查</text>
    <text x="479" y="159">现场观察</text>
    <text x="611" y="159">原型化方法</text>
    <text x="740" y="159">头脑风暴法</text>
  </g>

  <line x1="20" y1="188" x2="800" y2="188" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ③ 需求变更三步骤 -->
  <text x="20" y="210" font-size="13" font-weight="bold" fill="#1e3a5f">③ 需求变更控制过程</text>
  <g stroke="#93c5fd" fill="#eff6ff">
    <rect x="20"  y="218" width="240" height="40" rx="6"/>
    <rect x="290" y="218" width="240" height="40" rx="6"/>
    <rect x="560" y="218" width="240" height="40" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e3a5f">
    <text x="140" y="242">问题分析和变更描述</text>
    <text x="410" y="242">变更分析和成本计算</text>
    <text x="680" y="242">变更实现</text>
  </g>
  <g stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrowM)">
    <path d="M 260 238 L 289 238"/>
    <path d="M 530 238 L 559 238"/>
  </g>
  <text x="20" y="278" font-size="10.5" fill="#1e3a5f">变更控制委员会（CCB）职责：制定决策 · 交流情况 · 重新协商约定</text>

  <line x1="20" y1="292" x2="800" y2="292" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ④ 需求追踪 -->
  <text x="20" y="314" font-size="13" font-weight="bold" fill="#14532d">④ 需求追踪（双向，⚠️ 2018年11月软考高级第40题考点）</text>
  <g stroke="#6ee7b7" fill="#ecfdf5">
    <rect x="150" y="322" width="230" height="40" rx="6"/>
    <rect x="440" y="322" width="230" height="40" rx="6"/>
  </g>
  <text x="265" y="346" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#065f46">需求规格说明书</text>
  <text x="555" y="346" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#065f46">后继工作成果（设计/代码/测试）</text>
  <g stroke="#059669" stroke-width="1.8" fill="none" marker-end="url(#arrowM)">
    <path d="M 380 336 L 439 336"/>
  </g>
  <text x="410" y="330" text-anchor="middle" font-size="9.5" fill="#059669">正向跟踪</text>
  <g stroke="#059669" stroke-width="1.8" fill="none" marker-end="url(#arrowM)">
    <path d="M 439 352 L 381 352"/>
  </g>
  <text x="410" y="368" text-anchor="middle" font-size="9.5" fill="#059669">逆向跟踪</text>

  <defs>
    <marker id="arrowM" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#3b82f6"/>
    </marker>
  </defs>
</svg>
