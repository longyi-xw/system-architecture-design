  <text x="20" y="386" font-size="10" fill="#374151">上排=6个核心过程工作流；下排=3个核心支持工作流（⚠️检索补充的二分维度）</text>

  <line x1="20" y1="400" x2="800" y2="400" stroke="#e5e7eb" stroke-width="1"/>

