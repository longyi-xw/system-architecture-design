    <path d="M 170 453 L 177 453"/>
    <path d="M 328 453 L 335 453"/>
    <path d="M 486 453 L 493 453"/>
    <path d="M 644 453 L 651 453"/>
  </g>
  <text x="20" y="502" font-size="10.5" fill="#4c1d95">⚠️ 检索补充：Level 4 量化管理级的核心是"用统计技术预测过程性能"（供理解记忆，教材原文措辞待核对）</text>

  <defs>
    <marker id="arrowL" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
