    <rect x="178" y="430" width="150" height="46" rx="6" fill="#ede9fe" stroke="#c4b5fd"/>
    <rect x="336" y="430" width="150" height="46" rx="6" fill="#ddd6fe" stroke="#a78bfa"/>
