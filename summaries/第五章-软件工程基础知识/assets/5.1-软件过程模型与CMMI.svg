    <text x="115" y="220" font-size="9">交流·简单·反馈·勇气</text>
    <text x="313" y="204" font-size="12" font-weight="bold">Scrum</text>
    <text x="313" y="220" font-size="9">侧重项目管理</text>
    <text x="511" y="204" font-size="12" font-weight="bold">Crystal 水晶系列</text>
