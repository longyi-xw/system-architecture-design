    <text x="253" y="450">Level 2</text>
    <text x="253" y="465" font-size="10" font-weight="normal">已管理级</text>
    <text x="411" y="450">Level 3</text>
    <text x="411" y="465" font-size="10" font-weight="normal">已定义级</text>
    <text x="569" y="450">Level 4</text>
    <text x="569" y="465" font-size="10" font-weight="normal">量化管理级</text>
    <text x="726" y="450">Level 5</text>
    <text x="726" y="465" font-size="10" font-weight="normal">优化级</text>
